const WIDGET_CSS = "/* Light theme tokens. The series colours are the dataviz palette's first two slots, validated for the light surface;\n   the dark theme below re-steps them for its surface. The contents list in the page's margin sits on the host page,\n   not on the widget's card, so it takes the tokens of the surface under it (data-surface, set by the script). */\n:host,\n.contents.side[data-surface=\"light\"] {\n\t--surface: #ffffff;\n\t--text-primary: #0b0b0b;\n\t--text-secondary: #52514e;\n\t--text-muted: #6f6d68;\n\t--gridline: #e1e0d9;\n\t--baseline: #c3c2b7;\n\t/* Chart gridlines and baselines are the text colour at these opacities (#e1e0d9 and #c3c2b7 on white), so Dark\n\t   Reader, which turns any solid stroke light, leaves them as faint as they are here. */\n\t--gridline-opacity: 0.12;\n\t--baseline-opacity: 0.25;\n\t--border: rgba(11, 11, 11, 0.1);\n\t--series-contract: #2a78d6;\n\t--series-contract-light: #86b6ef;\n\t--series-contract-continuing: #b7d3f6;\n\t--series-policy: #eb6834;\n\t--series-policy-light: #f3a07c;\n\t--series-superseded: #c3c2b7;\n\t--focus: #2a78d6;\n\t--link: #1c5cab;\n\t--selected: rgba(42, 120, 214, 0.08);\n\t/* The highlighter mark behind a highlighted school's name in the charts and the timelines. */\n\t--highlight-mark: rgba(42, 120, 214, 0.2);\n\t--notice: #fdf4e3;\n\t--panel-surface: #ffffff;\n\t--panel-shadow: 0 6px 24px rgba(11, 11, 11, 0.14);\n\t/* Living-cost marks sit on the bars and off them, so they take the strongest ink, with a halo of the surface. */\n\t--living-mark: #0b0b0b;\n\t/* The \u25b2 beside rent above 30 percent of pay in a details panel. */\n\t--burden: #b3261e;\n\t/* Controls: a border with 3:1 contrast or more against the surface, and a quiet hover fill. */\n\t--control-border: #6f6d68;\n\t--control-surface: #ffffff;\n\t--control-hover: #eeede7;\n\t--chevron: #6f6d68;\n\t/* The faint band behind every other timeline row. */\n\t--band: rgba(11, 11, 11, 0.03);\n\t/* The tint behind the inline contents list, which sets it apart from the controls. */\n\t--contents-surface: #f5f4f0;\n}\n\n:host {\n\t/* Status colours are fixed in both themes and always come with an icon shape and text. */\n\t--status-good: #0ca30c;\n\t--status-warning: #fab219;\n\t/* The type scale: five sizes. */\n\t--size-title: 24px;\n\t--size-section: 19px;\n\t--size-body: 15px;\n\t--size-label: 13px;\n\t--size-small: 12px;\n\tdisplay: block;\n}\n\n/* Dark theme: the same roles stepped for a dark surface, the series colours re-validated against it. */\n.root[data-theme=\"dark\"],\n.contents.side[data-surface=\"dark\"] {\n\tcolor-scheme: dark;\n\t--surface: #1a1a19;\n\t--text-primary: #f0efec;\n\t--text-secondary: #c3c2b7;\n\t--text-muted: #a19f97;\n\t--gridline: #2c2c2a;\n\t--baseline: #5a5953;\n\t--gridline-opacity: 0.085;\n\t--baseline-opacity: 0.3;\n\t--border: rgba(255, 255, 255, 0.12);\n\t--series-contract: #3987e5;\n\t/* The summer end of a bar is lighter than the bar in both themes (\"the lighter end of the bar\"): here the series\n\t   colour 40 percent of the way to the text colour, 1.6:1 against the bar and 7.3:1 or more against the surface. */\n\t--series-contract-light: #82b1e8;\n\t--series-contract-continuing: #2a4a72;\n\t--series-policy: #d95926;\n\t--series-policy-light: #e29575;\n\t--series-superseded: #5a5953;\n\t--focus: #6aa6ee;\n\t--link: #8ab8f2;\n\t--selected: rgba(57, 135, 229, 0.18);\n\t--highlight-mark: rgba(57, 135, 229, 0.36);\n\t--notice: #3a3020;\n\t--panel-surface: #242422;\n\t--panel-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);\n\t--living-mark: #f0efec;\n\t--burden: #ff8a80;\n\t--control-border: #8d8b84;\n\t--control-surface: #242422;\n\t--control-hover: #30302d;\n\t--chevron: #a19f97;\n\t--band: rgba(255, 255, 255, 0.035);\n\t--contents-surface: #222220;\n}\n\n/* The theme's rules for the host element (a div) beat :host, so the typography is set on the root instead. Line\n   height, letter spacing and word spacing are inherited from the mount, whose line height the snippet sets in the page,\n   so a reader's own text-spacing settings reach the widget. */\n.root {\n\tposition: relative;\n\tcolor-scheme: light;\n\tfont-family: \"Noto Sans\", \"Noto Sans SC\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n\tfont-size: var(--size-body);\n\tfont-weight: 400;\n\tfont-style: normal;\n\tline-height: inherit;\n\ttext-align: left;\n\ttext-transform: none;\n\ttext-indent: 0;\n\twhite-space: normal;\n\tcolor: var(--text-primary);\n\tbackground: var(--surface);\n\tpadding: 4px 0 12px;\n}\n\n/* Chinese: the site's Noto Sans for Latin text, then the platforms' Simplified Chinese fonts (macOS and iOS, Android\n   and Linux, Windows). First comes \"AUN CJK Punctuation\", which the script defines in the document (a shadow root\n   ignores @font-face) from the same Chinese fonts for the curly quotes, the dash and the ellipsis alone, so they are\n   drawn full width as in Chinese text, not with Noto Sans's narrow Latin forms. English text keeps those. */\n.root:lang(zh) {\n\tfont-family: \"AUN CJK Punctuation\", \"Noto Sans\", \"PingFang SC\", \"Noto Sans SC\", \"Microsoft YaHei\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n}\n\n.root:lang(zh) :lang(en) {\n\tfont-family: \"Noto Sans\", \"PingFang SC\", \"Noto Sans SC\", \"Microsoft YaHei\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n}\n\n/* On a dark page or a dark system setting the widget is its own dark panel. */\n.root[data-theme=\"dark\"] {\n\tborder-radius: 12px;\n\tpadding: 20px;\n}\n\n.root[data-theme=\"dark\"][data-layout=\"narrow\"] {\n\tpadding: 14px 10px;\n\tborder-radius: 8px;\n}\n\n/* On the standalone page the page itself takes the theme, so the widget needs no panel of its own in either, and\n   switching the theme leaves the layout where it is. */\n.root[data-standalone][data-theme] {\n\tpadding: 4px 0 12px;\n\tborder-radius: 0;\n}\n\n* {\n\tbox-sizing: border-box;\n}\n\n[hidden] {\n\tdisplay: none !important;\n}\n\nh1,\nh2,\nh3,\nh4,\nh5,\nh6 {\n\tfont-weight: 600;\n}\n\n/* Headings take their size from their class, not their level, which is one higher on the standalone page (its\n   title is the page's h1) than in the block (an h2 under the WordPress page's h1). */\n.section-heading:focus,\n.chart-heading:focus,\n.contents:focus {\n\toutline: none;\n}\n\n.block-heading,\n.panel-title {\n\tfont-size: 1em;\n\tmargin: 0;\n}\n\np {\n\tmargin: 0 0 8px;\n}\n\na {\n\tcolor: var(--link);\n}\n\n/* Header: the title with the theme switch and the contents list, the computed lead, the byline (the network's logo\n   and name, and the data's date), and the dek that says what minimum pay is. */\n.widget-header {\n\tmargin-bottom: 8px;\n}\n\n.title-row {\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\talign-items: center;\n\tjustify-content: space-between;\n\tgap: 8px 16px;\n\tmargin-bottom: 6px;\n}\n\n/* The theme switch and the contents list's button, together at the title row's end, or on a line under the title. */\n.title-tools {\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\talign-items: center;\n\tgap: 8px 16px;\n}\n\n.title {\n\tfont-size: var(--size-title);\n\tline-height: 1.2;\n\tmargin: 0;\n}\n\n.lead {\n\tfont-size: var(--size-section);\n\tline-height: 1.35;\n\tfont-weight: 500;\n\tmargin: 0 0 10px;\n\tmax-width: 46em;\n\ttext-wrap: pretty;\n}\n\n/* Under the lead: the button to the rent view, which the lead speaks of. While the chart shows that view the place\n   stays empty, as tall as the button, so the controls below do not move. */\n.lead-action {\n\tmin-height: 32px;\n\tmargin: -2px 0 12px;\n}\n\n.root[data-layout=\"narrow\"] .lead-action {\n\tmin-height: 44px;\n}\n\n.lead-action .action-cue {\n\tflex: none;\n}\n\n.byline {\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\talign-items: center;\n\tgap: 4px 0;\n\tmargin: 0 0 12px;\n\tfont-size: var(--size-label);\n\tcolor: var(--text-secondary);\n}\n\n/* The network's logo beside its name, centred on the line, whether the name is a link (in the WordPress block) or\n   text (on the standalone page, whose header links the network). */\n.byline :is(a, .byline-name) {\n\tdisplay: inline-flex;\n\talign-items: center;\n\tgap: 8px;\n\tcolor: var(--text-secondary);\n\ttext-decoration: none;\n}\n\n.byline a:hover span {\n\ttext-decoration: underline;\n\ttext-underline-offset: 3px;\n}\n\n.byline-separator {\n\tmargin: 0 6px;\n}\n\n/* On phones the date takes its own line, so the separator would dangle. */\n.root[data-layout=\"narrow\"] .byline-separator {\n\tdisplay: none;\n}\n\n.root[data-layout=\"narrow\"] .byline .updated {\n\tflex-basis: 100%;\n}\n\n.byline .logo {\n\tflex: none;\n\twidth: 28px;\n\theight: 28px;\n\tborder-radius: 50%;\n}\n\n/* Under the lead while only the chosen schools show: the finding is still that of all schools. */\n.widget-header .coverage-note {\n\tfont-size: var(--size-label);\n\tcolor: var(--text-secondary);\n\tmargin: -4px 0 10px;\n}\n\n.dek {\n\tcolor: var(--text-secondary);\n\tmax-width: 46em;\n\tmargin-bottom: 12px;\n}\n\n.stale-note,\n.preview-status,\n.status-title {\n\tdisplay: flex;\n\talign-items: center;\n\tgap: 6px;\n}\n\n/* A note that can wrap keeps its icon on its first line. */\n.stale-note {\n\talign-items: flex-start;\n\tfont-size: var(--size-label);\n\tcolor: var(--text-secondary);\n}\n\n.stale-note .status-icon {\n\tmargin-top: 2px;\n}\n\n.link-button {\n\tfont: inherit;\n\tfont-size: var(--size-label);\n\tcolor: var(--link);\n\tbackground: none;\n\tborder: none;\n\tpadding: 0;\n\tmin-height: 24px;\n\ttext-decoration: underline;\n\ttext-underline-offset: 3px;\n\tcursor: pointer;\n}\n\n/* The theme control: a small segmented switch beside the title. */\n.theme-control {\n\tdisplay: flex;\n\talign-items: center;\n\tgap: 8px;\n\tfont-size: var(--size-label);\n\tcolor: var(--text-secondary);\n}\n\n.segmented.compact button {\n\tfont-size: var(--size-small);\n\tmin-height: 28px;\n\tpadding: 3px 10px;\n}\n\n/* The status icon: a check mark on green for data up to date, a clock on amber for data that may be out of date. */\n.status-icon {\n\tflex: none;\n\tvertical-align: -2px;\n\tforced-color-adjust: none;\n}\n\n.status-current .status-disc {\n\tfill: var(--status-good);\n}\n\n.status-check .status-disc {\n\tfill: var(--status-warning);\n\tstroke: var(--text-secondary);\n\tstroke-width: 0.75;\n}\n\n.status-ink {\n\tfill: none;\n\tstroke-width: 1.6;\n\tstroke-linecap: round;\n\tstroke-linejoin: round;\n}\n\n.status-current .status-ink {\n\tstroke: #ffffff;\n}\n\n.status-check .status-ink {\n\tstroke: #0b0b0b;\n}\n\n/* Under the chart, beside its latest rates: the schools whose data may be out of date. */\n.status-summary {\n\tmargin: 12px 0 0;\n}\n\n.to-check-list {\n\tmargin: 8px 0;\n\tpadding-left: 20px;\n}\n\n.to-check-list li {\n\tmargin: 4px 0;\n}\n\n.reason {\n\tmargin-right: 6px;\n}\n\n.status-block {\n\tmargin: 8px 0;\n\tpadding: 8px 10px;\n\tborder-left: 3px solid var(--baseline);\n}\n\n.status-block.check {\n\tborder-left-color: var(--status-warning);\n}\n\n.status-block .status-title {\n\tfont-size: 1em;\n\tmargin: 0 0 4px;\n}\n\n.status-block .reasons {\n\tmargin: 4px 0;\n\tpadding-left: 0;\n\tlist-style: none;\n}\n\n.status-block .reasons li {\n\tmargin: 3px 0;\n}\n\n/* The contents list: inline, an \"On this page\" disclosure beside the theme switch whose links drop down under it in\n   a panel over the page; or a panel fixed in the page's left margin when the viewport leaves room (the script sets\n   its position and keeps it open there). */\n/* A link back to the list puts it below the window's top edge, so the focused link's ring shows whole. */\n.contents {\n\tfont-size: var(--size-label);\n\tscroll-margin-top: var(--scroll-offset, 16px);\n}\n\n.contents:not(.side) {\n\tposition: relative;\n}\n\n.contents:not(.side) .contents-disclosure > ul {\n\tposition: absolute;\n\tz-index: 30;\n\tright: 0;\n\ttop: calc(100% + 6px);\n\twidth: max-content;\n\tmax-width: min(22em, calc(100vw - 32px));\n\tpadding: 6px 14px;\n\tbackground: var(--panel-surface);\n\tborder: 1px solid var(--border);\n\tborder-radius: 8px;\n\tbox-shadow: var(--panel-shadow);\n}\n\n/* In the margin, the list's name is a quiet heading over its links, in the disclosure's place. */\n.contents-label {\n\tmargin: 0 0 6px;\n\tfont-size: var(--size-small);\n\tfont-weight: 600;\n\tcolor: var(--text-secondary);\n}\n\n.contents:not(.side) .contents-label,\n.contents.side .contents-disclosure > summary {\n\tdisplay: none;\n}\n\n.contents ul {\n\tmargin: 0;\n\tpadding: 0;\n\tlist-style: none;\n}\n\n\n.contents a {\n\tdisplay: inline-flex;\n\talign-items: center;\n\tmin-height: 24px;\n}\n\n.contents a[aria-current=\"location\"] {\n\tfont-weight: 600;\n\tcolor: var(--text-primary);\n}\n\n/* Inline, each link is a \u2193 and its underlined name, the whole row its target. */\n.contents:not(.side) a {\n\tdisplay: flex;\n\talign-items: baseline;\n\tgap: 6px;\n\tmin-height: 32px;\n\tpadding: 6px 0;\n\ttext-decoration: none;\n}\n\n.contents:not(.side) .contents-text {\n\ttext-decoration: underline;\n\ttext-decoration-thickness: 1px;\n\ttext-underline-offset: 3px;\n}\n\n@media (hover: hover) {\n\t.contents:not(.side) a:hover .contents-text {\n\t\ttext-decoration-thickness: 2px;\n\t}\n}\n\n.contents-cue {\n\tflex: none;\n}\n\n.contents.side .contents-cue {\n\tdisplay: none;\n}\n\n.contents.side {\n\tposition: fixed;\n\tz-index: 10;\n\tmargin: 0;\n\tpadding: 10px 0 10px 12px;\n\tborder-left: 1px solid var(--gridline);\n\tcolor: var(--text-primary);\n\ttransition: opacity 0.15s ease;\n}\n\n.contents.side[data-surface=\"light\"] {\n\tcolor-scheme: light;\n}\n\n/* Where the page's colour under the list leaves its links short of 4.5:1 contrast with either palette, the list takes\n   its palette's surface as a backdrop. */\n.contents.side.backdrop {\n\tpadding-right: 10px;\n\tbackground: var(--surface);\n\tborder: 1px solid var(--border);\n\tborder-radius: 6px;\n}\n\n.contents.side a {\n\tposition: relative;\n\tdisplay: flex;\n\tpadding: 2px 0;\n}\n\n/* The current section: a bar over the list's rule beside its link. */\n.contents.side a[aria-current=\"location\"]::before {\n\tcontent: \"\";\n\tposition: absolute;\n\tleft: -13px;\n\ttop: 2px;\n\tbottom: 2px;\n\twidth: 2px;\n\tbackground: var(--text-primary);\n}\n\n.contents.side.out-of-view:not(:focus-within) {\n\topacity: 0;\n\tpointer-events: none;\n}\n\n/* On phones each link is a 44 px row at body size. */\n.root[data-layout=\"narrow\"] .contents:not(.side) ul {\n\tfont-size: var(--size-body);\n}\n\n.root[data-layout=\"narrow\"] .contents:not(.side) a {\n\talign-items: center;\n\tmin-height: 44px;\n\tpadding: 4px 0;\n}\n\n/* \"Back to contents\" at the end of each section: a small button, hidden (and out of the tab order) while the contents\n   list sits in the margin, where it is always in view. */\n.back-row {\n\tmargin: 10px 0 0;\n}\n\n.root.side-contents .back-row {\n\tdisplay: none;\n}\n\n.back-to-contents {\n\tdisplay: inline-flex;\n\talign-items: center;\n\tgap: 6px;\n\tmin-height: 28px;\n\tpadding: 2px 10px;\n\tfont-size: var(--size-label);\n\tcolor: var(--text-primary);\n\ttext-decoration: none;\n\tbackground: var(--control-surface);\n\tborder: 1px solid var(--control-border);\n\tborder-radius: 6px;\n}\n\n@media (hover: hover) {\n\t.back-to-contents:hover {\n\t\tbackground: var(--control-hover);\n\t}\n}\n\n/* With the button above it, a section's heading needs less space before it. */\n.root:not(.side-contents) .back-row + .section-heading,\n.root:not(.side-contents) .back-row + :is(.page-section, .landmark-section) > .section-heading:first-child {\n\tmargin-top: 24px;\n}\n\n@media (prefers-reduced-motion: reduce) {\n\t.contents.side {\n\t\ttransition: none;\n\t}\n}\n\n/* Section headings: a step up from body text, with space and a hairline above. */\n.section-heading {\n\tfont-size: var(--size-section);\n\tline-height: 1.3;\n\tmargin: 40px 0 12px;\n\tpadding-top: 16px;\n\tborder-top: 1px solid var(--gridline);\n\tscroll-margin-top: var(--scroll-offset, 16px);\n}\n\n/* The chart's heading is a section heading like its sibling h3s, without the rule above. */\n.chart-heading {\n\tfont-size: var(--size-section);\n\tmargin: 20px 0 4px;\n\tscroll-margin-top: var(--scroll-offset, 16px);\n}\n\n/* On phones the lead and the chart's heading are a step smaller and the controls closer, so the chart's first row\n   shows on the first screen. */\n.root[data-layout=\"narrow\"] :is(.lead, .chart-heading) {\n\tfont-size: 17px;\n}\n\n.root[data-layout=\"narrow\"] .chart-heading {\n\tmargin-top: 16px;\n}\n\n.root[data-layout=\"narrow\"] .controls {\n\tmargin-top: 14px;\n}\n\n.chart-summary {\n\ttext-wrap: pretty;\n}\n\n/* Under the per-year view's heading: where to compare appointments of different lengths. */\n.view-note {\n\tmargin: 0 0 8px;\n\tfont-size: var(--size-label);\n\tcolor: var(--text-secondary);\n\tmax-width: 46em;\n\ttext-wrap: pretty;\n}\n\n/* Why a chart has no rows, in place of the chart. */\n.chart-empty {\n\tmargin: 8px 0 12px;\n\tfont-size: 14px;\n\tcolor: var(--text-secondary);\n\tmax-width: 46em;\n\ttext-wrap: pretty;\n}\n\n.subtitle {\n\tcolor: var(--text-secondary);\n}\n\n/* The page's foot: how many schools the page covers, and the notice from the page text. */\n.colophon {\n\tmargin-top: 32px;\n\tpadding-top: 16px;\n\tborder-top: 1px solid var(--gridline);\n}\n\n.colophon .footnote {\n\tmargin: 0 0 6px;\n\tfont-size: var(--size-label);\n\tcolor: var(--text-secondary);\n}\n\n.page-notice {\n\tfont-size: var(--size-label);\n\tcolor: var(--text-secondary);\n\tmargin: 0;\n\tmax-width: 46em;\n}\n\n.network-links {\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\tgap: 4px 18px;\n\tmargin: 0 0 8px;\n\tpadding: 0;\n\tlist-style: none;\n\tfont-size: var(--size-label);\n}\n\n/* On phones, a list of one link to a line, at body size. */\n.root[data-layout=\"narrow\"] .network-links {\n\tflex-direction: column;\n\tgap: 0;\n\tfont-size: var(--size-body);\n}\n\n/* The license badge and the suggested credit, under the download links. */\n.license a {\n\tdisplay: inline-flex;\n\talign-items: center;\n\tgap: 8px;\n}\n\n.license-icons {\n\tdisplay: inline-flex;\n\tgap: 2px;\n}\n\n.license-icon {\n\tdisplay: block;\n\tforced-color-adjust: none;\n}\n\n.suggested-credit {\n\tmargin: 4px 0 8px;\n}\n\n.page-section .credit-label {\n\tmargin: 0 0 4px;\n\tcolor: var(--text-primary);\n\tfont-weight: 600;\n}\n\n.credit-row {\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\talign-items: center;\n\tgap: 6px 10px;\n}\n\n.page-section .credit-text {\n\tmargin: 0;\n\tpadding: 4px 10px;\n\tborder-left: 3px solid var(--baseline);\n\tcolor: var(--text-primary);\n\tmax-width: 100%;\n}\n\n.copy-status {\n\tfont-size: var(--size-label);\n\tcolor: var(--text-secondary);\n}\n\n.page-section p {\n\tcolor: var(--text-secondary);\n\tmax-width: 46em;\n}\n\n.page-section strong {\n\tcolor: var(--text-primary);\n}\n\n.download-links {\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\tgap: 8px;\n\tmargin: 4px 0 12px;\n\tpadding: 0;\n\tlist-style: none;\n}\n\n.purpose ul {\n\tmargin: 0 0 8px;\n\tpadding-left: 20px;\n\tmax-width: 46em;\n\tcolor: var(--text-secondary);\n}\n\n.purpose li {\n\tmargin: 3px 0;\n}\n\n/* Loading and failure messages, which stand in for the widget so the page never shows a blank gap. */\n.message {\n\tmargin: 0;\n\tcolor: var(--text-secondary);\n}\n\n.muted {\n\tcolor: var(--text-muted);\n}\n\n/* A hidden sample of label text: its size changes with the reader's text spacing, which redraws the charts. */\n.spacing-probe {\n\tposition: absolute;\n\ttop: 0;\n\tleft: 0;\n\tvisibility: hidden;\n\tpointer-events: none;\n\twhite-space: nowrap;\n\tfont-size: var(--size-label);\n}\n\n.visually-hidden,\n.skip-link:not(:focus) {\n\tposition: absolute;\n\twidth: 1px;\n\theight: 1px;\n\tmargin: -1px;\n\tpadding: 0;\n\toverflow: hidden;\n\tclip: rect(0 0 0 0);\n\tclip-path: inset(50%);\n\twhite-space: nowrap;\n\tborder: 0;\n}\n\n/* Shown over the header when focused, so nothing moves. */\n.skip-link {\n\tposition: absolute;\n\ttop: 4px;\n\tleft: 0;\n\tz-index: 40;\n\tfont: inherit;\n\tcolor: var(--link);\n\tbackground: var(--panel-surface);\n\tborder: 1px solid var(--border);\n\tborder-radius: 6px;\n\tpadding: 4px 10px;\n\tcursor: pointer;\n}\n\nbutton {\n\tfont: inherit;\n\tcolor: inherit;\n}\n\n/* A reader's text spacing reaches the text in controls too, which browsers otherwise reset. */\nbutton,\nselect,\ninput {\n\tletter-spacing: inherit;\n\tword-spacing: inherit;\n}\n\n.controls {\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\tgap: 12px 20px;\n\talign-items: flex-start;\n\tmargin: 20px 0 8px;\n}\n\n.controls label,\n.sort-control,\n.filter-control {\n\tcolor: var(--text-secondary);\n\tfont-size: var(--size-label);\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\tgap: 4px 8px;\n\talign-items: center;\n\tmax-width: 100%;\n}\n\n.view-control {\n\tdisplay: flex;\n\tmin-width: 0;\n\tmax-width: 100%;\n}\n\n/* In the chart's \"How to read\", only the shown view's description. */\n.view-descriptions {\n\tmargin: 0 0 8px;\n}\n\n.view-description {\n\tmargin: 0;\n\ttext-wrap: pretty;\n}\n\n.view-description:not(.shown) {\n\tdisplay: none;\n}\n\n/* One style for every control: the year, sort and filter selects, the view and theme switches, the download links,\n   the Copy button and the disclosures' summaries. */\nselect,\n.segmented button,\n.copy-button,\n.button-link,\n.disclosure > summary,\n.close-end {\n\tfont: inherit;\n\tfont-size: 14px;\n\tline-height: 1.3;\n\tcolor: var(--text-primary);\n\tbackground: var(--control-surface);\n\tborder: 1px solid var(--control-border);\n\tborder-radius: 6px;\n\tpadding: 5px 12px;\n\tmin-height: 32px;\n\tmax-width: 100%;\n\tcursor: pointer;\n}\n\n.button-link,\n.disclosure > summary {\n\tdisplay: inline-flex;\n\talign-items: center;\n\tgap: 8px;\n\ttext-decoration: none;\n}\n\n/* Hover fills only where a pointer hovers: touch browsers keep :hover on the last control tapped. */\n@media (hover: hover) {\n\t.copy-button:hover,\n\t.button-link:hover,\n\t.disclosure > summary:hover,\n\t.close-end:hover,\n\t.segmented button:not([aria-pressed=\"true\"]):hover,\n\tselect:hover {\n\t\tbackground: var(--control-hover);\n\t}\n}\n\n.page-section .button-link {\n\tcolor: var(--text-primary);\n}\n\n/* Disclosures: a chevron that points right when closed and down when open. */\n.disclosure > summary {\n\tlist-style: none;\n}\n\n.disclosure > summary::-webkit-details-marker {\n\tdisplay: none;\n}\n\n.disclosure > summary::before,\n.chevron {\n\tcontent: \"\";\n\tflex: none;\n\tdisplay: inline-block;\n\twidth: 6px;\n\theight: 6px;\n\tborder-right: 2px solid var(--chevron);\n\tborder-bottom: 2px solid var(--chevron);\n\ttransform: rotate(-45deg);\n}\n\n.disclosure > summary::before {\n\tmargin: 0 2px 0 0;\n\ttransition: transform 0.15s ease;\n}\n\n.disclosure[open] > summary::before {\n\ttransform: rotate(45deg);\n}\n\n@media (prefers-reduced-motion: reduce) {\n\t.disclosure > summary::before {\n\t\ttransition: none;\n\t}\n}\n\n/* The chevron after a chart row's value, a timeline row's name and a table cell's text: it shows at rest that\n   selecting them opens details. */\n.chevron {\n\tmargin: 0 1px 1px 7px;\n\tvertical-align: middle;\n}\n\n.pay-row:focus-visible .chevron,\n.timeline-row:focus-visible .chevron,\n.cell-button:focus-visible .chevron,\n[aria-expanded=\"true\"] .chevron {\n\tborder-color: var(--text-primary);\n}\n\n@media (hover: hover) {\n\t.pay-row:hover .chevron,\n\t.timeline-row:hover .chevron,\n\t.cell-button:hover .chevron {\n\t\tborder-color: var(--text-primary);\n\t}\n}\n\n.chart-hint {\n\tmargin: 8px 0 0;\n\tfont-size: var(--size-label);\n\tcolor: var(--text-secondary);\n\tmax-width: 46em;\n\ttext-wrap: pretty;\n}\n\n.segmented {\n\tdisplay: inline-flex;\n}\n\n.segmented button {\n\tborder-radius: 0;\n\twhite-space: nowrap;\n}\n\n.segmented button:first-child {\n\tborder-radius: 6px 0 0 6px;\n}\n\n.segmented button:last-child {\n\tborder-radius: 0 6px 6px 0;\n}\n\n.segmented button + button {\n\tborder-left: none;\n}\n\n/* The pressed button is tinted in the accent colour, edged in it (its left edge too, which the button before it\n   draws), and carries a bar along its bottom edge: a cue that survives a recolouring of the tint (Dark Reader's) and\n   changes no width. It is not inverted, since a black \"Auto\" or \"Light\" read as the dark theme being on. */\n.segmented button[aria-pressed=\"true\"] {\n\tbackground: color-mix(in srgb, var(--focus) 16%, var(--control-surface));\n\tcolor: var(--text-primary);\n\tborder-color: var(--focus);\n\tbox-shadow:\n\t\tinset 0 -3px 0 0 var(--focus),\n\t\t-1px 0 0 0 var(--focus);\n}\n\n.segmented button[aria-pressed=\"true\"]:first-child {\n\tbox-shadow: inset 0 -3px 0 0 var(--focus);\n}\n\n/* On phones the view switch spans the width, its three buttons sharing it without wrapping. */\n.root[data-layout=\"narrow\"] .view-control,\n.root[data-layout=\"narrow\"] .view-control .segmented {\n\twidth: 100%;\n}\n\n.root[data-layout=\"narrow\"] .view-control {\n\tflex-basis: 100%;\n}\n\n/* Labels may wrap inside the buttons, so the switch fits at 320 px and at 400% zoom. */\n.root[data-layout=\"narrow\"] .view-control .segmented button {\n\tflex: 1 1 0;\n\tmin-width: 0;\n\tpadding: 5px 6px;\n\twhite-space: normal;\n}\n\n/* Highlighting schools: a disclosure with a search box and checkboxes, and a chip per highlighted school. On wide\n   layouts it sits at the controls row's right edge, as wide as its open panel and switch whether open or not, with its\n   button at the right and the chips on a line of their own under it, so that opening the panel or choosing a school\n   moves neither the button nor the list under the pointer. */\n.highlight-control {\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\talign-items: flex-start;\n\tgap: 8px;\n\tmax-width: 100%;\n}\n\n.root[data-layout=\"wide\"] .highlight-control {\n\tmargin-left: auto;\n\twidth: min(440px, 100%);\n\tjustify-content: flex-end;\n}\n\n.root[data-layout=\"wide\"] .highlight-picker > summary {\n\tdisplay: flex;\n\twidth: fit-content;\n\tmargin-left: auto;\n}\n\n.root[data-layout=\"wide\"] .highlight-control > .chips {\n\tflex-basis: 100%;\n\tjustify-content: flex-end;\n}\n\n.picker {\n\tmargin-top: 8px;\n\tpadding: 10px;\n\tborder: 1px solid var(--gridline);\n\tborder-radius: 8px;\n\tbackground: var(--panel-surface);\n\twidth: min(420px, 100%);\n}\n\n/* Its label starts at the left like every other label (the controls row centres its labels' items). */\n.controls .picker-label {\n\tdisplay: flex;\n\tflex-direction: column;\n\talign-items: stretch;\n\tgap: 4px;\n\tfont-size: var(--size-label);\n\tcolor: var(--text-secondary);\n}\n\n.picker-search {\n\tfont: inherit;\n\tfont-size: 14px;\n\tcolor: var(--text-primary);\n\tbackground: var(--control-surface);\n\tborder: 1px solid var(--control-border);\n\tborder-radius: 6px;\n\tpadding: 5px 8px;\n\tmin-height: 32px;\n\twidth: 100%;\n}\n\n.picker-list {\n\tmax-height: 260px;\n\toverflow-y: auto;\n\tmargin: 8px 0;\n\tpadding: 0;\n\tlist-style: none;\n\tfont-size: 14px;\n}\n\n.picker-list label {\n\tdisplay: flex;\n\talign-items: center;\n\tgap: 8px;\n\tmin-height: 28px;\n\tcursor: pointer;\n}\n\n.picker-list input {\n\twidth: 16px;\n\theight: 16px;\n\taccent-color: var(--series-contract);\n}\n\n.chips {\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\tgap: 6px;\n\tmargin: 0;\n\tpadding: 0;\n\tlist-style: none;\n}\n\n/* While the picker is open the chips follow it, below, as they do in the tab order. */\n.highlight-control:has(> details[open]) > .chips {\n\tflex-basis: 100%;\n}\n\n.chip {\n\tfont-size: var(--size-label);\n\tmin-height: 32px;\n\tpadding: 3px 10px;\n\tborder: 1px solid var(--control-border);\n\tborder-radius: 16px;\n\tbackground: var(--selected);\n\tcolor: var(--text-primary);\n\tcursor: pointer;\n}\n\n/* How to show the chosen schools: a two-way switch like the chart's views, after its label and over the current\n   choice's description, on a line of its own under the chips, outside the panel, so the state stays in view with the\n   panel closed. On phones its two buttons share the width. */\n.choice-mode {\n\tflex-basis: 100%;\n\tdisplay: flex;\n\tflex-direction: column;\n\tgap: 4px;\n\tmin-width: 0;\n}\n\n.choice-switch {\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\talign-items: center;\n\tgap: 4px 8px;\n}\n\n.choice-mode-label,\n.choice-description,\n.choice-hint {\n\tmargin: 0;\n\tfont-size: var(--size-label);\n\tcolor: var(--text-secondary);\n}\n\n.root[data-layout=\"narrow\"] .choice-mode .segmented {\n\tdisplay: flex;\n\twidth: 100%;\n}\n\n.root[data-layout=\"narrow\"] .choice-mode .segmented button {\n\tflex: 1 1 0;\n\tmin-width: 0;\n\tpadding-inline: 8px;\n\twhite-space: normal;\n}\n\n/* \"Only chosen schools\" before any school is chosen: muted, with no hover fill, and the hint under it says why. */\n.segmented button[aria-disabled=\"true\"] {\n\tcolor: var(--text-muted);\n\tcursor: not-allowed;\n}\n\n@media (hover: hover) {\n\t.segmented button[aria-disabled=\"true\"]:hover {\n\t\tbackground: var(--control-surface);\n\t}\n}\n\n/* On phones the button that opens the panel spans the width, so its label can grow with the count and nothing\n   beside it moves. */\n.root[data-layout=\"narrow\"] .highlight-control,\n.root[data-layout=\"narrow\"] .highlight-picker,\n.root[data-layout=\"narrow\"] .highlight-picker > summary {\n\twidth: 100%;\n}\n\n/* While only the chosen schools show: the line under each section's heading that says how many, with its Show all\n   button, on the tint of the chosen schools' chips. */\n.choice-note {\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\talign-items: center;\n\twidth: fit-content;\n\tmax-width: 100%;\n\tmargin: 0 0 10px;\n\tpadding: 2px 10px;\n\tborder-radius: 6px;\n\tbackground: var(--selected);\n\tfont-size: 14px;\n\tcolor: var(--text-primary);\n}\n\n.choice-note .link-button {\n\tfont-size: inherit;\n}\n\n.choice-note-separator {\n\twhite-space: pre;\n}\n\n.notice {\n\tbackground: var(--notice);\n\tborder-radius: 6px;\n\tpadding: 6px 10px;\n\tfont-size: 14px;\n\tmax-width: 46em;\n\ttext-wrap: pretty;\n}\n\n.legend {\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\tgap: 6px 18px;\n\tfont-size: var(--size-label);\n\tcolor: var(--text-secondary);\n\tmargin: 0 0 8px;\n\tpadding: 0;\n\tlist-style: none;\n}\n\n.legend-item {\n\tdisplay: inline-flex;\n\talign-items: center;\n\tgap: 6px;\n}\n\n/* On phones, one item to a line: every key takes the same box, so the labels share one left edge. The over-time\n   view's legend of school names wraps them instead. */\n.root[data-layout=\"narrow\"] .legend:not(.names) {\n\tflex-direction: column;\n\talign-items: flex-start;\n}\n\n.root[data-layout=\"narrow\"] .legend-item > :first-child {\n\tflex: none;\n\twidth: 30px;\n}\n\n.key {\n\tflex: none;\n\toverflow: visible;\n}\n\n/* The asterisk of a calculated figure, as the value labels show it, in a key's box. */\n.key-glyph {\n\tdisplay: inline-block;\n\twidth: 24px;\n\ttext-align: center;\n\tfont-size: var(--size-body);\n\tfont-weight: 600;\n\tline-height: 1;\n\tcolor: var(--text-primary);\n}\n\n/* Pay chart and timeline rows: a name column and a track. On narrow layouts the name sits above the track. */\n.pay-list,\n.timeline-list {\n\tlist-style: none;\n\tmargin: 0;\n\tpadding: 0;\n}\n\n.pay-list > li,\n.timeline-list > li {\n\tmargin: 0;\n\tpadding: 0;\n}\n\n.pay-row,\n.timeline-row,\n.axis-row {\n\tdisplay: grid;\n\tgrid-template-columns: var(--name-column, 150px) minmax(0, 1fr);\n\tcolumn-gap: 10px;\n\talign-items: center;\n\twidth: 100%;\n}\n\n.pay-row,\n.timeline-row {\n\tposition: relative;\n\tbackground: none;\n\tborder: none;\n\tpadding: 0;\n\tmargin: 0;\n\ttext-align: left;\n\tcursor: pointer;\n\tborder-radius: 4px;\n}\n\n.pay-row {\n\tmin-height: 34px;\n}\n\n.root[data-layout=\"wide\"] .pay-row .name {\n\talign-self: end;\n\tline-height: 14px;\n\tpadding-bottom: 4px;\n}\n\n/* Names are semibold, so they stand above the muted union line under them. They wrap between words rather than being\n   cut off, also when a reader's text spacing widens them; only a word wider than the whole column breaks. */\n.pay-row .name,\n.timeline-row .name {\n\tfont-size: var(--size-label);\n\tfont-weight: 600;\n\tcolor: var(--text-secondary);\n\ttext-align: right;\n\toverflow-wrap: break-word;\n}\n\n.name-text {\n\tdisplay: inline;\n}\n\n.name-text .status-icon {\n\tmargin-left: 4px;\n}\n\n.track {\n\tdisplay: block;\n\tline-height: 0;\n}\n\n.track svg {\n\tdisplay: block;\n\toverflow: visible;\n\tforced-color-adjust: none;\n}\n\n/* A wide row's value label sits on a backing of the surface colour, so gridlines and the median and 30 percent lines\n   pass behind it. The backing is a background, which Dark Reader darkens exactly as it darkens the widget's own. */\n.pay-row .value {\n\tposition: absolute;\n\ttop: 0;\n\tmargin-left: -3px;\n\tpadding: 0 3px;\n\tborder-radius: 3px;\n\tbackground: var(--surface);\n\tfont-size: var(--size-label);\n\tline-height: 16px;\n\twhite-space: nowrap;\n\tfont-variant-numeric: tabular-nums;\n\tcolor: var(--text-primary);\n\tpointer-events: none;\n}\n\n.pay-row[aria-expanded=\"true\"] .value {\n\tbackground: linear-gradient(var(--selected), var(--selected)), var(--surface);\n}\n\n@media (hover: hover) {\n\t.pay-row:hover .value {\n\t\tbackground: linear-gradient(var(--selected), var(--selected)), var(--surface);\n\t}\n}\n\n.tag {\n\tcolor: var(--text-muted);\n}\n\n/* A label's parts (amount, length, tags, pay per month): each whole on one line with the separator that follows it.\n   The separator box is as wide as \" \u00b7 \", so the label measures as its text does. The last part's separator is a\n   spacer, which only phones keep (see below). */\n.segment {\n\twhite-space: nowrap;\n}\n\n.separator {\n\tdisplay: inline-block;\n\twidth: 0.8em;\n\ttext-align: center;\n\tcolor: var(--text-muted);\n}\n\n.separator.end {\n\tdisplay: none;\n}\n\n.label-clip,\n.label-parts {\n\tdisplay: contents;\n}\n\n/* The yearly chart's pay per month, after the rest of the label in muted text. Where the whole label would crowd the\n   row, it takes a line of its own under the rest, without the separator. */\n.monthly {\n\tcolor: var(--text-muted);\n\twhite-space: nowrap;\n}\n\n.value.wrapped .monthly {\n\tdisplay: block;\n}\n\n/* The rent chart's pay, in that place, in the label's own colour; tags that follow it (whose figure it is) stay\n   muted. On phones the pay and its tags wrap between parts, as the rest of a label does. */\n.monthly.plain {\n\tcolor: inherit;\n}\n\n.root[data-layout=\"narrow\"] .pay-row .value .monthly {\n\twhite-space: normal;\n}\n\n.value.wrapped .before-monthly {\n\tvisibility: hidden;\n}\n\n.pay-row:focus-visible .bar,\n.pay-row:focus-visible .soft-bar {\n\tfilter: brightness(1.12);\n}\n\n/* The timeline's rows alternate a faint band, so each row's stacked marks read as its own. */\n:where(.timeline-list > li:nth-child(even)) > .timeline-row {\n\tbackground: var(--band);\n}\n\n.pay-row[aria-expanded=\"true\"],\n.timeline-row[aria-expanded=\"true\"] {\n\tbackground: var(--selected);\n}\n\n@media (hover: hover) {\n\t.pay-row:hover .bar,\n\t.pay-row:hover .soft-bar {\n\t\tfilter: brightness(1.12);\n\t}\n\n\t.pay-row:hover,\n\t.timeline-row:hover {\n\t\tbackground: var(--selected);\n\t}\n}\n\n/* Highlighted schools keep their strength and their names are marked as with a highlighter, in the tint of the\n   highlight chips (every name is already semibold, so weight cannot mark them); the rest fade: their marks (and\n   clocks) to a third of their strength, their names, values and the timeline's notes to the muted ink, which keeps\n   4.5:1 contrast (set after the narrow layout's rules below). The mark reaches 3 px past the name on either side\n   without moving it. */\n.pay-row.faded .track,\n.timeline-row.faded .track svg > :not(.track-note),\n:is(.pay-row, .timeline-row).faded .name .status-icon {\n\topacity: 0.35;\n}\n\n:is(.pay-row, .timeline-row).highlighted .name-text {\n\tmargin-inline: -3px;\n\tpadding-inline: 3px;\n\tborder-radius: 3px;\n\tbackground: var(--highlight-mark);\n\tcolor: var(--text-primary);\n\t-webkit-box-decoration-break: clone;\n\tbox-decoration-break: clone;\n}\n\ntr.highlighted .school-name {\n\tfont-weight: 700;\n\tcolor: var(--text-primary);\n}\n\ntr.highlighted th,\ntr.highlighted td {\n\tbackground: var(--selected);\n}\n\n.pay-row:focus-visible,\n.timeline-row:focus-visible,\n.cell-button:focus-visible,\n.sort-button:focus-visible,\nselect:focus-visible,\n.picker-search:focus-visible,\n.picker-list input:focus-visible,\n.segmented button:focus-visible,\nsummary:focus-visible,\n.skip-link:focus-visible,\n.close:focus-visible,\n.close-end:focus-visible,\n.copy-button:focus-visible,\n.button-link:focus-visible,\n.link-button:focus-visible,\n.chip:focus-visible,\n.root a:focus-visible {\n\toutline: 2px solid var(--focus);\n\toutline-offset: 2px;\n}\n\n.pay-row:focus-visible,\n.timeline-row:focus-visible {\n\toutline-offset: -2px;\n}\n\n/* On narrow rows the name starts at the button's edge, so the ring sits outside it. */\n.root[data-layout=\"narrow\"] .pay-row:focus-visible,\n.root[data-layout=\"narrow\"] .timeline-row:focus-visible {\n\toutline-offset: 2px;\n}\n\n/* On phones the name sits above the bar with the value label beside it; the label takes at most 55% of the width and\n   wraps, so the name keeps room for its longest word. */\n.root[data-layout=\"narrow\"] .pay-row,\n.root[data-layout=\"narrow\"] .timeline-row,\n.root[data-layout=\"narrow\"] .axis-row {\n\tgrid-template-columns: minmax(0, 1fr) fit-content(55%);\n\tgrid-template-areas: \"name value\" \"track track\";\n\tcolumn-gap: 8px;\n}\n\n.root[data-layout=\"narrow\"] .pay-row {\n\theight: auto;\n\talign-items: start;\n\tpadding: 4px 0 6px;\n\trow-gap: 2px;\n}\n\n.root[data-layout=\"narrow\"] .timeline-row {\n\tpadding: 4px 0;\n}\n\n.root[data-layout=\"narrow\"] .pay-row .name,\n.root[data-layout=\"narrow\"] .timeline-row .name {\n\tgrid-area: name;\n\ttext-align: left;\n\tcolor: var(--text-primary);\n}\n\n/* On phones a label's parts are right-aligned, every one followed by its separator (the last one's hidden), and the\n   parts are clipped one separator short of the right edge, so a separator that ends a line falls outside and none is\n   left dangling. */\n.root[data-layout=\"narrow\"] .pay-row .value .label-clip {\n\tdisplay: block;\n\toverflow: hidden;\n}\n\n.root[data-layout=\"narrow\"] .pay-row .value .label-parts {\n\tdisplay: block;\n\tmargin-right: -0.8em;\n}\n\n.root[data-layout=\"narrow\"] .pay-row .value .separator.end {\n\tdisplay: inline-block;\n\tvisibility: hidden;\n}\n\n/* A long label wraps in balanced lines, its chevron kept at the end of the last one. */\n.root[data-layout=\"narrow\"] .pay-row .value {\n\tgrid-area: value;\n\tposition: relative;\n\tmargin: 0;\n\tpadding: 0 15px 0 0;\n\tbackground: none;\n\ttext-align: right;\n\twhite-space: normal;\n\ttext-wrap: balance;\n}\n\n/* A long tag takes lines of its own on phones, where it would otherwise squeeze the school's name: it wraps clear of\n   the clipped edge, and a line break, not a separator, sets it apart from the parts around it. */\n.root[data-layout=\"narrow\"] .pay-row .value .segment.long {\n\tdisplay: block;\n\tmargin-right: 0.8em;\n\twhite-space: normal;\n}\n\n.root[data-layout=\"narrow\"] .pay-row .value .segment.long > .separator {\n\tdisplay: none;\n}\n\n.root[data-layout=\"narrow\"] .pay-row .value .chevron {\n\tposition: absolute;\n\tright: 3px;\n\tbottom: 6px;\n\tmargin: 0;\n}\n\n.root[data-layout] .pay-row.faded :is(.name, .value),\n.root[data-layout] .timeline-row.faded .name {\n\tcolor: var(--text-muted);\n}\n\n.root[data-layout=\"narrow\"] .track {\n\tgrid-area: track;\n}\n\n.root[data-layout=\"narrow\"] .axis-row .name {\n\tdisplay: none;\n}\n\n/* A chart's or the timelines' row: the row's button, and its unions laid over its name column, linked to their\n   websites (a button cannot hold a link). The button takes the list item's grid (subgrid), so the name, the unions\n   and the track keep their places: the unions under the name, in its column, on wide layouts (the bars keep their\n   width); on a line of their own under the name on phones. Every row keeps that line, held by an empty placeholder\n   where a school has no union, and a union's label stays on it, ending in an ellipsis where the column is too narrow,\n   so no row is shorter or taller than the rest and the bars are evenly spaced.\n   A bar chart's rows all take the height of its tallest (one whose value label wraps, or on phones whose name or\n   label takes more lines), the room left over going above the name, so each bar keeps its place at its row's foot.\n   For that the list is the grid: each item takes three of its rows (subgrid), the first sized alike in every item\n   (1fr), then the unions' line and a row for the details panel that opens inline on phones, which is empty\n   otherwise, so an open panel lengthens its own item alone. Phones add the track's row before the panel's. */\n.pay-list {\n\tdisplay: grid;\n\tgrid-template-columns: minmax(0, 1fr);\n\tgrid-auto-rows: 1fr auto auto;\n}\n\n.root[data-layout=\"narrow\"] .pay-list {\n\tgrid-auto-rows: 1fr auto auto auto;\n}\n\n:is(.pay-list, .timeline-list) > li.row-item {\n\tdisplay: grid;\n\tgrid-template-columns: var(--name-column, 150px) minmax(0, 1fr);\n\tgrid-template-rows: 1fr auto;\n\tcolumn-gap: 10px;\n}\n\n.pay-list > li.row-item {\n\tgrid-row: span 3;\n\tgrid-template-rows: subgrid;\n}\n\n.root[data-layout=\"narrow\"] .pay-list > li.row-item {\n\tgrid-row: span 4;\n}\n\n/* The median's divider takes a slim track of its own, after the rows' tracks of the schools at or above the median\n   (--rows-above of them); the rows below take the implicit tracks, which repeat the pattern from its start, so every\n   row keeps the same height. */\n.pay-list[data-median-after] {\n\tgrid-template-rows: repeat(var(--rows-above), 1fr auto auto) auto;\n}\n\n.root[data-layout=\"narrow\"] .pay-list[data-median-after] {\n\tgrid-template-rows: repeat(var(--rows-above), 1fr auto auto auto) auto;\n}\n\n.root .pay-list[data-median-after=\"0\"] {\n\tgrid-template-rows: auto;\n}\n\n/* The divider: its label where the schools' names are, and a dotted rule like the median line across the bars'\n   column. */\n.pay-list > li.median-divider {\n\tpadding: 2px 0;\n\tfont-size: var(--size-small);\n\tline-height: 16px;\n\tcolor: var(--text-secondary);\n\tfont-variant-numeric: tabular-nums;\n}\n\n.median-divider-line {\n\tdisplay: grid;\n\tgrid-template-columns: var(--name-column, 150px) minmax(0, 1fr);\n\tcolumn-gap: 10px;\n\talign-items: center;\n}\n\n.median-divider-label {\n\ttext-align: right;\n}\n\n.median-rule {\n\tdisplay: block;\n\toverflow: visible;\n\tforced-color-adjust: none;\n}\n\n/* On phones the label leads the line, and the divider keeps some room from the bar above and the name below. */\n.root[data-layout=\"narrow\"] .pay-list > li.median-divider {\n\tpadding: 8px 0 6px;\n}\n\n.root[data-layout=\"narrow\"] .median-divider-line {\n\tgrid-template-columns: auto minmax(0, 1fr);\n\tcolumn-gap: 8px;\n}\n\n.root[data-layout=\"narrow\"] .median-divider-label {\n\ttext-align: left;\n}\n\n/* The button spans the name's and the unions' rows (and the track's on phones), not the panel's. */\n:is(.pay-list, .timeline-list) > li.row-item > :is(.pay-row, .timeline-row) {\n\tgrid-column: 1 / -1;\n\tgrid-row: 1 / span 2;\n\tgrid-template-columns: subgrid;\n\tgrid-template-rows: subgrid;\n\tgrid-template-areas: none;\n}\n\n.root[data-layout=\"narrow\"] :is(.pay-list, .timeline-list) > li.row-item > :is(.pay-row, .timeline-row) {\n\tgrid-row: 1 / span 3;\n}\n\n/* A details panel that opens inline (on phones) takes the item's full width, under the row. */\n:is(.pay-list, .timeline-list) > li.row-item > .panel:not(.floating) {\n\tgrid-column: 1 / -1;\n}\n\n:is(.pay-list, .timeline-list) > li.row-item > :is(.pay-row, .timeline-row) .name {\n\tgrid-column: 1;\n\tgrid-row: 1;\n\talign-self: end;\n}\n\n.timeline-list > li.row-item > .timeline-row .track {\n\tgrid-column: 2;\n\tgrid-row: 1 / -1;\n\talign-self: center;\n}\n\n.pay-list > li.row-item > .pay-row .track {\n\tgrid-column: 2;\n\tgrid-row: 1;\n\talign-self: end;\n}\n\n/* A wide row's value label sits in the track's grid area, its foot at the top of the bar (the script sets how far\n   above the track's foot that is). Both ends of the area are given: a positioned item's missing end would be the\n   row's edge. */\n.root[data-layout=\"wide\"] .pay-list > li.row-item > .pay-row .value {\n\tgrid-column: 2 / 3;\n\tgrid-row: 1 / 2;\n\ttop: auto;\n}\n\n.union-links {\n\tgrid-column: 1;\n\tgrid-row: 2;\n\tdisplay: flex;\n\tjustify-content: flex-end;\n\tjustify-self: end;\n\talign-self: start;\n\tposition: relative;\n\tz-index: 1;\n\tmin-width: 0;\n\tmax-width: 100%;\n\tpadding-bottom: 4px;\n\tfont-size: var(--size-small);\n\tline-height: 16px;\n\tcolor: var(--text-muted);\n\twhite-space: nowrap;\n}\n\n.union-links.placeholder {\n\tpointer-events: none;\n}\n\n/* A union's label is a target of at least 24 px (44 px on phones); on wide layouts it reaches 4 px past its 16 px\n   line above and below, so the row grows only by the line. A label without a link takes the same box, so its row is\n   as tall as the rest. */\n.union-links > :is(a, .union-name),\n.union-line a {\n\tdisplay: inline-flex;\n\talign-items: center;\n\tmin-width: 0;\n\tmin-height: 24px;\n}\n\n.union-links > :is(a, .union-name) > span {\n\tmin-width: 0;\n\toverflow: hidden;\n\ttext-overflow: ellipsis;\n}\n\n.root[data-layout=\"wide\"] .union-links > :is(a, .union-name) {\n\tmargin-block: -4px;\n}\n\n.root[data-layout=\"narrow\"] :is(.pay-list, .timeline-list) > li.row-item {\n\tgrid-template-columns: minmax(0, 1fr) fit-content(55%);\n\tcolumn-gap: 8px;\n\trow-gap: 2px;\n}\n\n.root[data-layout=\"narrow\"] .timeline-list > li.row-item {\n\tgrid-template-rows: 1fr auto auto;\n}\n\n.root[data-layout=\"narrow\"] :is(.pay-list, .timeline-list) > li.row-item > :is(.pay-row, .timeline-row) .name {\n\tgrid-column: 1;\n\tgrid-row: 1;\n\talign-self: end;\n}\n\n.root[data-layout=\"narrow\"] .pay-list > li.row-item > .pay-row .value {\n\tgrid-column: 2;\n\tgrid-row: 1;\n\talign-self: end;\n}\n\n.root[data-layout=\"narrow\"] :is(.pay-list, .timeline-list) > li.row-item > :is(.pay-row, .timeline-row) .track {\n\tgrid-column: 1 / -1;\n\tgrid-row: 3;\n}\n\n.root[data-layout=\"narrow\"] .union-links {\n\tgrid-column: 1 / -1;\n\tgrid-row: 2;\n\tjustify-content: flex-start;\n\tjustify-self: start;\n\tpadding-bottom: 0;\n}\n\n.root[data-layout=\"narrow\"] :is(.union-links > :is(a, .union-name), .union-line a) {\n\tmin-height: 44px;\n}\n\n/* In the bar charts and the timelines a union is a quiet link under the school's name, which stays the strongest text\n   in its column: the muted ink (4.5:1 in both themes) with a thin dotted underline, turning to the link colour with a\n   solid underline on hover and keyboard focus. The table and the details keep the usual link style. */\n.union-links a {\n\tcolor: var(--text-muted);\n\ttext-decoration-line: underline;\n\ttext-decoration-style: dotted;\n\ttext-decoration-thickness: 1px;\n\ttext-underline-offset: 2px;\n}\n\n.union-links a:is(:hover, :focus-visible) {\n\tcolor: var(--link);\n\ttext-decoration-style: solid;\n}\n\n/* A faded row's unions fade with its name. */\n:is(.pay-row, .timeline-row).faded ~ .union-links,\n:is(.pay-row, .timeline-row).faded ~ .union-links a {\n\tcolor: var(--text-muted);\n}\n\n.axis-title {\n\tfont-size: var(--size-small);\n\tcolor: var(--text-muted);\n\tmargin: 2px 0 10px;\n}\n\n.track text {\n\tfont-size: var(--size-small);\n\tfill: var(--text-muted);\n\tfont-variant-numeric: tabular-nums;\n}\n\n.track .reference-label {\n\tfill: var(--text-secondary);\n}\n\n.gridline {\n\tstroke: currentColor;\n\tstroke-opacity: var(--gridline-opacity);\n\tstroke-width: 1;\n}\n\n.baseline,\n.tick {\n\tstroke: currentColor;\n\tstroke-opacity: var(--baseline-opacity);\n\tstroke-width: 1;\n}\n\n.bar.series-contract {\n\tfill: var(--series-contract);\n}\n\n.bar.series-policy {\n\tfill: var(--series-policy);\n}\n\n.bar.summer {\n\tstroke-width: 1;\n}\n\n.bar.summer.series-contract {\n\tfill: var(--series-contract-light);\n\tstroke: var(--series-contract);\n}\n\n.bar.summer.series-policy {\n\tfill: var(--series-policy-light);\n\tstroke: var(--series-policy);\n}\n\n/* The 12-month outline: hollow, with a fine dashed edge in muted ink, the same after both kinds of bar, so it never\n   reads as pay (which is always tinted, summer pay included). */\n.extension {\n\tfill: none;\n\tstroke: var(--text-muted);\n\tstroke-width: 1;\n\tstroke-dasharray: 3 2;\n}\n\n.soft-bar {\n\tstroke-width: 1;\n}\n\n/* An estimate's or qualifying amount's bar: hollow, edged and dotted in its series colour, so it reads apart from\n   minimum pay's solid bars and from university policy's stripes. */\n.soft-bar.series-contract {\n\tstroke: var(--series-contract);\n}\n\n.soft-bar.series-policy {\n\tstroke: var(--series-policy);\n}\n\n.hatch-dot.series-contract {\n\tfill: var(--series-contract);\n}\n\n.hatch-dot.series-policy {\n\tfill: var(--series-policy);\n}\n\n.hatch-ground {\n\tfill: none;\n}\n\n/* University policy's hatch: light stripes over the bar's fill, edged in the series colour so the bar's edge keeps its\n   contrast. */\n.policy-hatch {\n\tstroke: var(--series-policy);\n\tstroke-width: 1;\n}\n\n.policy-stripe {\n\tstroke: #ffffff;\n\tstroke-opacity: 0.5;\n\tstroke-width: 1.5;\n}\n\n/* Living costs on the bars: a dot for rent, a vertical line for living costs from the cost of attendance, the dashed\n   30 percent line on the rent chart, and the dotted median on the pay chart. A living-cost mark is inked like the\n   timeline's event marks: filled in a text colour, or hollow with no fill, so a recolouring that keeps text readable\n   keeps them apart. Unlike those, it keeps a halo of the surface, which sets it off from the pale end of a bar with\n   summer pay (where ink alone would show at about 2:1 in the dark theme); where Dark Reader recolours the halo as\n   text, it merges with the fill, and the mark still reads as filled. */\n.living-mark {\n\tfill: var(--living-mark);\n\tstroke: var(--surface);\n\tstroke-width: 2;\n\tpaint-order: stroke;\n}\n\n/* A partial estimate (its budget leaves some costs unitemized) is hollow. */\n.living-mark.partial {\n\tfill: none;\n\tstroke: var(--living-mark);\n\tstroke-width: 1.5;\n\tpaint-order: normal;\n}\n\n.burden-line {\n\tstroke: var(--living-mark);\n\tstroke-width: 1.5;\n\tstroke-dasharray: 4 3;\n}\n\n.median-line {\n\tstroke: var(--text-secondary);\n\tstroke-width: 1;\n\tstroke-dasharray: 1 3;\n\tstroke-linecap: round;\n}\n\n.flag {\n\tcolor: var(--burden);\n}\n\n/* The network's credit inside a chart's frame. */\n.credit {\n\tdisplay: block;\n\toverflow: visible;\n\tmargin-top: 2px;\n}\n\n.credit text {\n\tfont-size: var(--size-small);\n\tfill: var(--text-muted);\n}\n\n/* \"How to read this chart\" (and this table), above what it explains: the summary is a control like the others; what\n   it opens is quiet text at the label size. */\n.how-to-read {\n\tmargin: 0 0 12px;\n\tfont-size: var(--size-label);\n\tcolor: var(--text-secondary);\n}\n\n.how-to-read > :not(summary, .label-key) {\n\tmax-width: 46em;\n}\n\n.how-to-read[open] > summary {\n\tmargin-bottom: 8px;\n}\n\n.how-to-read > p {\n\tmargin: 0 0 8px;\n}\n\n.how-to-read > .legend {\n\tmargin: 8px 0;\n}\n\n.how-to-read .notes {\n\tmargin: 8px 0;\n\tpadding-left: 18px;\n}\n\n.how-to-read .notes li {\n\tmargin: 4px 0;\n\ttext-wrap: pretty;\n}\n\n.how-to-read :is(.legend, .notes, .coverage-note):empty {\n\tdisplay: none;\n}\n\n/* A page section's parts behind disclosures (About this data, and the rest of a section's text). */\n.page-section .section-more {\n\tmargin: 8px 0;\n}\n\n.page-section .section-more > p {\n\tmargin: 8px 0 4px;\n}\n\n.soft-block {\n\tmargin: 16px 0 8px;\n\tpadding-top: 12px;\n\tborder-top: 1px solid var(--gridline);\n}\n\n.soft-block .block-heading {\n\tmargin-bottom: 4px;\n}\n\n.soft-block > p {\n\tfont-size: var(--size-label);\n\tmax-width: 46em;\n\ttext-wrap: pretty;\n}\n\n.not-charted {\n\tmargin: 12px 0 0;\n\tfont-size: 14px;\n\tcolor: var(--text-secondary);\n}\n\n.not-charted ul {\n\tmargin: 8px 0 0;\n\tpadding: 0;\n\tlist-style: none;\n}\n\n.not-charted li {\n\tmargin: 6px 0;\n}\n\n/* Timeline */\n.timeline-details > .subtitle {\n\tmargin-top: 10px;\n}\n\n.contract-bar {\n\tstroke-width: 1;\n}\n\n.contract-bar.status-current {\n\tfill: var(--series-contract);\n\tstroke: var(--series-contract);\n}\n\n.contract-bar.status-expired-continuing {\n\tfill: var(--series-contract-continuing);\n\tstroke: var(--series-contract);\n}\n\n/* While an expired contract's terms still apply, a line runs through its bar and on to the date of the data: a cue\n   besides the paler fill that tells it from a contract in effect. */\n.continuing-line {\n\tstroke: var(--series-contract);\n\tstroke-width: 2;\n}\n\n/* \"Expired, no successor yet\" is hollow: an outline with nothing inside, which no restyling of colours can fill. */\n.contract-bar.status-expired {\n\tfill: none;\n\tstroke: var(--series-contract);\n\tstroke-width: 1.5;\n}\n\n/* Superseded and unknown contracts are thin grey bars (contractBarMarks), so they differ from the rest without colour.\n   Their edge is solid: a dashed outline means 12 months at the same rate in the bar charts. */\n.contract-bar.status-superseded,\n.contract-bar.status-unknown {\n\tfill: var(--series-superseded);\n\tstroke: var(--text-muted);\n}\n\n/* An event's mark is drawn in one colour, a text colour, and nothing else: filled, its fill and edge alike, or hollow,\n   an edge with nothing inside. So whatever recolours the page's text (Dark Reader, which treats every fill and stroke\n   as text, or forced colours) recolours the whole mark, and filled stays filled and hollow hollow. A halo or a hollow\n   inside painted in the surface colour would not: restyled as text, it no longer matches the surface behind it, and\n   the marks look swapped. */\n.marker {\n\tfill: var(--text-primary);\n\tstroke: var(--text-primary);\n\tstroke-width: 1;\n}\n\n.marker-other {\n\tfill: var(--text-secondary);\n\tstroke: var(--text-secondary);\n}\n\n/* A mark whose place is approximate (a date known only to the year, or an event off the scale): hollow. */\n.marker.hollow {\n\tfill: none;\n\tstroke: var(--text-primary);\n\tstroke-width: 1.5;\n}\n\n.as-of {\n\tstroke: var(--text-muted);\n\tstroke-width: 1;\n}\n\n.track .track-note,\n.key .track-note {\n\tfont-size: var(--size-small);\n\tfill: var(--text-muted);\n}\n\n/* Table */\n.table-details > summary {\n\tmargin-bottom: 8px;\n}\n\n/* The table's one-line introduction, then its \"How to read this table\". */\n.table-intro {\n\tfont-size: var(--size-label);\n\tcolor: var(--text-secondary);\n\tmax-width: 52em;\n\tmargin: 0 0 8px;\n}\n\n.table-explainer {\n\tmax-width: 52em;\n}\n\n.table-controls {\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\tgap: 8px 20px;\n\tmargin: 8px 0;\n}\n\n/* The key to the Union contract and benefit columns' labels, just above the table: each label in bold, then what it\n   means, in two columns where there is room. */\n.label-key {\n\tfont-size: var(--size-label);\n\tcolor: var(--text-secondary);\n\tmargin: 12px 0;\n}\n\n.label-key .key-heading {\n\tfont-size: var(--size-label);\n\tfont-weight: 600;\n\tcolor: var(--text-primary);\n\tmargin: 0 0 6px;\n}\n\n.key-groups {\n\tdisplay: grid;\n\tgrid-template-columns: repeat(auto-fit, minmax(280px, 1fr));\n\tgap: 4px 28px;\n}\n\n.key-group-title {\n\tfont-weight: 600;\n\tmargin: 0 0 2px;\n}\n\n.label-key dl {\n\tmargin: 0;\n}\n\n.label-key dl > div {\n\tmargin: 0 0 3px;\n}\n\n.label-key dt {\n\tdisplay: inline;\n\tfont-weight: 600;\n\tcolor: var(--text-primary);\n}\n\n.label-key dd {\n\tdisplay: inline;\n\tmargin: 0;\n}\n\n/* The table is drawn as cards (cards on the disclosure) on phones and wherever its columns do not fit; then \"Sort by\"\n   does the headings' job. */\n.table-details:not(.cards) .sort-control,\n.table-details:not(.cards) .narrow-only,\n.table-details.cards .wide-only {\n\tdisplay: none;\n}\n\n/* On cards both controls put their label above the select. */\n.table-details.cards .table-controls label {\n\tflex-direction: column;\n\talign-items: flex-start;\n}\n\n.table-wrap {\n\toverflow-x: auto;\n}\n\n/* Where the table fits without scrolling sideways, its heading row stays in view as the page scrolls, with a rule\n   along its bottom edge (a box shadow does not paint on collapsed-border cells). */\n.table-details:not(.cards) .table-wrap.fits {\n\toverflow: visible;\n}\n\n.table-details:not(.cards) .table-wrap.fits thead th {\n\tposition: sticky;\n\ttop: var(--sticky-top, 0px);\n\tz-index: 2;\n\tbackground: var(--surface);\n}\n\n.table-details:not(.cards) .table-wrap.fits thead th::after {\n\tcontent: \"\";\n\tposition: absolute;\n\tleft: 0;\n\tright: 0;\n\tbottom: -1px;\n\theight: 1px;\n\tbackground: var(--baseline);\n}\n\ntable {\n\tborder-collapse: collapse;\n\twidth: 100%;\n\tfont-size: 14px;\n}\n\ncaption {\n\ttext-align: left;\n\tpadding-bottom: 8px;\n\tfont-weight: 600;\n\tcolor: var(--text-primary);\n}\n\nth,\ntd {\n\ttext-align: left;\n\tpadding: 8px;\n\tborder-bottom: 1px solid var(--gridline);\n\tvertical-align: top;\n}\n\nth {\n\tcolor: var(--text-secondary);\n\tfont-weight: 600;\n}\n\ntbody th .school-name {\n\tcolor: var(--text-primary);\n}\n\n.status-line {\n\tdisplay: block;\n\tmargin-top: 2px;\n}\n\n/* The school's unions under its name, linked to their websites. */\n.union-line {\n\tdisplay: block;\n\tfont-size: var(--size-small);\n\tfont-weight: 400;\n\tcolor: var(--text-secondary);\n}\n\n.status-marker {\n\tdisplay: inline-flex;\n\talign-items: center;\n\tgap: 4px;\n\tfont-size: var(--size-small);\n\tfont-weight: 400;\n\tcolor: var(--text-secondary);\n}\n\ntd.number {\n\ttext-align: right;\n\tfont-variant-numeric: tabular-nums;\n}\n\n/* Headings over figures align with them, at the right. */\nth.number,\ntd.number .cell-button,\nth.number .sort-button {\n\ttext-align: right;\n}\n\n/* A school's name and a contract's status break only between words (in Chinese, at a comma: \u5df2\u5230\u671f\uff0c/\u6761\u6b3e\u7ee7\u7eed\u9002\u7528),\n   so narrow columns don't split them between any two characters; in Chinese the same holds for the benefit labels,\n   the notes where a figure is missing and the headings. */\ntbody th .school-name,\ntd.contract .main,\n.root:lang(zh) :is(td .main, td .muted, th .sort-button, tr.divider td) {\n\tword-break: keep-all;\n}\n\n/* Amounts and shares stay whole; the parts of a label may wrap between them. */\n.nowrap {\n\twhite-space: nowrap;\n}\n\n.share-bar {\n\tdisplay: block;\n\tmargin: 3px 0 0 auto;\n\tforced-color-adjust: none;\n}\n\n.share-track {\n\tfill: var(--gridline);\n}\n\n.share-fill {\n\tfill: var(--text-muted);\n}\n\n/* The part of a rent share past HUD's 30 percent line, in the colour of the details' \u25b2 for the same. */\n.share-fill.over {\n\tfill: var(--burden);\n}\n\n.share-tick {\n\tstroke: var(--text-primary);\n\tstroke-width: 1.5;\n}\n\n/* The key to the bars' mark: a small bar and its words, under the rent column's heading, which stays in view, and on\n   cards, which hide the headings, under each bar. */\n.share-key {\n\tdisplay: flex;\n\talign-items: flex-start;\n\tjustify-content: flex-end;\n\tgap: 4px;\n\tmargin-top: 4px;\n\tcolor: var(--text-muted);\n\tfont-size: var(--size-small);\n\tfont-weight: 400;\n\tline-height: 1.3;\n}\n\n.share-glyph {\n\tflex: none;\n\tmargin-top: 2px;\n\tforced-color-adjust: none;\n}\n\n/* Chinese breaks the key only between words: after its colon, or at its hint (U+200B). */\n.root:lang(zh) .share-key {\n\tword-break: keep-all;\n}\n\n/* On cards the key labels the bar's own mark: the mark's line runs down from the bar to the words. */\n.table-details.cards .share-key {\n\tjustify-content: flex-start;\n\tmargin: 0 0 0 calc(var(--share-line) - 0.75px);\n\tpadding: 2px 0 0 4px;\n\tborder-left: 1.5px solid var(--text-primary);\n}\n\n.table-details.cards .share-key .share-glyph {\n\tdisplay: none;\n}\n\n/* On the table the heading's key serves every row. */\n.table-details:not(.cards) td .share-key {\n\tdisplay: none;\n}\n\ntr.divider td {\n\tcolor: var(--text-muted);\n\tfont-size: var(--size-label);\n\tborder-bottom: 2px solid var(--baseline);\n\tpadding-top: 16px;\n}\n\n.sort-button {\n\tmin-height: 24px;\n\tbackground: none;\n\tborder: none;\n\tpadding: 0;\n\tcursor: pointer;\n\ttext-align: left;\n\tfont-weight: 600;\n}\n\n@media (hover: hover) {\n\t.sort-button:hover {\n\t\ttext-decoration: underline;\n\t\ttext-underline-offset: 3px;\n\t}\n}\n\n/* The sort mark is joined to the heading's last word by a no-break space, so it never takes a line alone. */\nth[aria-sort=\"none\"] .sort-button::after {\n\tcontent: \"\\00a0\u2195\" / \"\";\n\tcolor: var(--text-muted);\n\tfont-weight: 400;\n}\n\nth[aria-sort=\"ascending\"] .sort-button::after {\n\tcontent: \"\\00a0\u25b2\" / \"\";\n}\n\nth[aria-sort=\"descending\"] .sort-button::after {\n\tcontent: \"\\00a0\u25bc\" / \"\";\n}\n\n/* Column headings sort on the table; on cards, where the heading row is hidden, they are plain text, so no Tab stop\n   lands on an invisible button. */\n.table-details:not(.cards) .header-text,\n.table-details.cards .sort-button {\n\tdisplay: none;\n}\n\n.cell-button {\n\tmin-height: 24px;\n\tbackground: none;\n\tborder: none;\n\tpadding: 0;\n\ttext-align: left;\n\tcursor: pointer;\n\tborder-radius: 2px;\n}\n\n.cell-button:focus-visible .main,\n.cell-button[aria-expanded=\"true\"] .main {\n\ttext-decoration: underline;\n\ttext-underline-offset: 3px;\n}\n\n@media (hover: hover) {\n\t.cell-button:hover .main {\n\t\ttext-decoration: underline;\n\t\ttext-underline-offset: 3px;\n\t}\n}\n\n/* The conditions a benefit depends on, in up to three lines; the preview and the details give them in full. */\n.cell-button .scope {\n\tdisplay: -webkit-box;\n\t-webkit-line-clamp: 3;\n\t-webkit-box-orient: vertical;\n\toverflow: hidden;\n\tcolor: var(--text-muted);\n\tfont-size: var(--size-small);\n\tmax-width: 22em;\n}\n\n/* Under a label that provides nothing, the term that provides something to some students, in the text's colour. */\n.cell-button .scope.other-term {\n\tmargin-top: 2px;\n\tcolor: var(--text-secondary);\n}\n\n/* Chinese breaks between any two characters, so keep a lone one off the last line. */\n.root:lang(zh) .cell-button .scope {\n\ttext-wrap: pretty;\n}\n\n/* Cards: on phones, and wherever the table's columns do not fit its box (a tablet in portrait). The column headings\n   stay in the accessibility tree, hidden visually. A card is the school's name, then one line per column, its label\n   beside its value: one column of lines on phones, two where there is room. */\n.table-details.cards .table-wrap > table,\n.table-details.cards .table-wrap > table > tbody,\n.table-details.cards .table-wrap > table > tbody > tr,\n.table-details.cards .table-wrap > table > tbody > tr > th,\n.table-details.cards .table-wrap > table > caption {\n\tdisplay: block;\n\twidth: 100%;\n}\n\n.table-details.cards thead {\n\tposition: absolute;\n\twidth: 1px;\n\theight: 1px;\n\toverflow: hidden;\n\tclip: rect(0 0 0 0);\n\tclip-path: inset(50%);\n}\n\n.table-details.cards .table-wrap > table > tbody > tr {\n\tdisplay: grid;\n\tgrid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));\n\tcolumn-gap: 24px;\n\tborder-bottom: 1px solid var(--gridline);\n\tpadding: 10px 0;\n}\n\n.table-details.cards tbody th {\n\tgrid-column: 1 / -1;\n\tmargin-bottom: 2px;\n}\n\n.table-details.cards .table-wrap > table > tbody > tr > td {\n\tdisplay: grid;\n\tgrid-template-columns: minmax(0, 38%) minmax(0, 1fr);\n\tcolumn-gap: 10px;\n\talign-items: center;\n\tmin-height: 44px;\n\ttext-align: left;\n}\n\n.table-details.cards th,\n.table-details.cards td {\n\tborder: none;\n\tpadding: 0;\n}\n\n.table-details.cards td::before {\n\tcontent: attr(data-label) / \"\";\n\tcolor: var(--text-muted);\n\tfont-size: var(--size-small);\n\tline-height: 1.3;\n}\n\n.root:lang(zh) .table-details.cards td::before {\n\tword-break: keep-all;\n}\n\n/* A details panel that opens inside a card's line takes the whole line. */\n.table-details.cards td > .panel {\n\tgrid-column: 1 / -1;\n}\n\n.table-details.cards .cell-button {\n\twidth: 100%;\n\tmin-height: 44px;\n}\n\n.table-details.cards td.number .cell-button {\n\ttext-align: left;\n}\n\n.table-details.cards .share-bar {\n\tmargin-left: 0;\n}\n\n.table-details.cards .table-wrap > table > tbody > tr.divider {\n\tdisplay: block;\n}\n\n.table-details.cards .table-wrap > table > tbody > tr.divider > td {\n\tdisplay: block;\n\tmin-height: 0;\n}\n\n.table-details.cards tr.divider td::before {\n\tcontent: none;\n}\n\n/* Hover previews and details panels. A preview touches its row and can be hovered, so the pointer can move into it. */\n.preview {\n\tposition: absolute;\n\tz-index: 30;\n\twidth: max-content;\n\tmax-width: min(300px, calc(100% - 16px));\n\tbackground: var(--panel-surface);\n\tborder: 1px solid var(--border);\n\tborder-radius: 8px;\n\tbox-shadow: var(--panel-shadow);\n\tpadding: 8px 10px;\n\tfont-size: var(--size-label);\n\tline-height: 1.4;\n\tcursor: pointer;\n}\n\n.preview p {\n\tmargin: 0 0 3px;\n}\n\n.preview .preview-title {\n\tcolor: var(--text-secondary);\n}\n\n.preview .preview-value {\n\tfont-weight: 600;\n\tfont-variant-numeric: tabular-nums;\n}\n\n.preview .hint {\n\tcolor: var(--text-muted);\n\tfont-size: var(--size-small);\n\tmargin: 4px 0 0;\n}\n\n.clamp {\n\tdisplay: -webkit-box;\n\t-webkit-line-clamp: 3;\n\t-webkit-box-orient: vertical;\n\toverflow: hidden;\n}\n\n.panel {\n\tbackground: var(--panel-surface);\n\tcolor: var(--text-primary);\n\tborder: 1px solid var(--border);\n\tborder-radius: 10px;\n\tpadding: 10px 14px 12px;\n\tmargin: 6px 0 10px;\n\tfont-size: var(--size-label);\n\tfont-weight: 400;\n\tline-height: 1.45;\n\ttext-align: left;\n\twhite-space: normal;\n\tcursor: auto;\n}\n\n.panel.floating {\n\tposition: absolute;\n\tz-index: 20;\n\tmargin: 0;\n\twidth: min(460px, calc(100% - 16px));\n\tmax-height: 75vh;\n\toverflow: auto;\n\tbox-shadow: var(--panel-shadow);\n}\n\n.panel-header {\n\tdisplay: flex;\n\talign-items: flex-start;\n\tjustify-content: space-between;\n\tgap: 12px;\n\tmargin-bottom: 4px;\n}\n\n.panel-header .panel-title {\n\tfont-size: 15px;\n\tpadding-top: 4px;\n}\n\n.close {\n\tflex: none;\n\tbackground: none;\n\tborder: 1px solid transparent;\n\tborder-radius: 6px;\n\tmin-width: 32px;\n\tmin-height: 32px;\n\tfont-size: 1.4em;\n\tline-height: 1;\n\tcolor: var(--text-secondary);\n\tcursor: pointer;\n}\n\n@media (hover: hover) {\n\t.close:hover {\n\t\tborder-color: var(--border);\n\t}\n}\n\n.panel-footer {\n\tmargin: 12px 0 0;\n}\n\n.panel-value {\n\tfont-size: 15px;\n\tfont-weight: 600;\n\tmargin-bottom: 6px;\n}\n\n.panel-value .muted {\n\tfont-size: var(--size-label);\n\tfont-weight: 400;\n}\n\n/* What a label means, under it in a preview or a details panel, as the table's key says. */\n.label-meaning {\n\tcolor: var(--text-secondary);\n}\n\n.preview .label-meaning {\n\tfont-size: var(--size-small);\n}\n\n/* The terms take a column of one width in every list, so lists stacked in a panel line up. */\n.panel dl {\n\tmargin: 8px 0;\n\tdisplay: grid;\n\tgrid-template-columns: 10.5em minmax(0, 1fr);\n\tgap: 2px 10px;\n}\n\n.panel dl:lang(zh) {\n\tgrid-template-columns: 8em minmax(0, 1fr);\n}\n\n/* On phones each term sits above its value, so values keep the panel's width. */\n.root[data-layout=\"narrow\"] .panel dl:not(.lines) {\n\tgrid-template-columns: minmax(0, 1fr);\n\tgap: 0;\n}\n\n.root[data-layout=\"narrow\"] .panel dl:not(.lines) dd {\n\tmargin-bottom: 6px;\n}\n\n.panel dt {\n\tcolor: var(--text-muted);\n}\n\n.panel dd {\n\tmargin: 0;\n\tmin-width: 0;\n\toverflow-wrap: anywhere;\n}\n\n/* A budget's lines: the label wraps, the amount stays whole at the right. */\n.panel dl.lines {\n\tgrid-template-columns: minmax(0, 1fr) auto;\n}\n\n.panel dl.lines dd {\n\ttext-align: right;\n\twhite-space: nowrap;\n\tfont-variant-numeric: tabular-nums;\n\toverflow-wrap: normal;\n}\n\n/* Under a line's amount: which end of a range is used, or the amount the source states per term. */\n.panel dl.lines .line-note {\n\tdisplay: block;\n\twhite-space: normal;\n\tfont-size: var(--size-small);\n}\n\n/* Under a line, across the list: its note, which names the columns of the table row its source quotes. */\n.panel dl.lines dd.line-explanation {\n\tgrid-column: 1 / -1;\n\tmargin-bottom: 4px;\n\ttext-align: start;\n\twhite-space: normal;\n\toverflow-wrap: anywhere;\n\tcolor: var(--text-muted);\n\tfont-size: var(--size-small);\n\tfont-variant-numeric: normal;\n}\n\n/* A details panel's pay by appointment: each appointment's titles, its pay, then its level and the link to its source.\n   The charted one is shaded as a selected row is, and says so in words. */\n.appointment-list {\n\tlist-style: none;\n\tmargin: 6px 0;\n\tpadding: 0;\n}\n\n.appointment-list > li {\n\tmargin: 0 -8px;\n\tpadding: 6px 8px;\n\tborder-radius: 6px;\n}\n\n.appointment-list > li + li {\n\tborder-top: 1px solid var(--gridline);\n}\n\n.appointment-list > li.charted,\n.appointment-list > li.charted + li {\n\tborder-top-color: transparent;\n}\n\n.appointment-list > li.charted {\n\tbackground: var(--selected);\n}\n\n.appointment-list p {\n\tmargin: 0;\n}\n\n.appointment-name {\n\tfont-weight: 600;\n}\n\n/* The separator between a title and its badge, for screen readers and copied text: hidden, but inline, so that the\n   text runs \"Teaching Assistant, In the chart\" on one line. */\n.appointment-separator {\n\tdisplay: inline-block;\n\twidth: 1px;\n\theight: 1px;\n\tmargin: -1px;\n\toverflow: hidden;\n\tclip-path: inset(50%);\n\twhite-space: pre;\n}\n\n.appointment-charted {\n\tdisplay: inline-block;\n\tmargin-inline-start: 8px;\n\twhite-space: nowrap;\n\tfont-size: var(--size-small);\n\tfont-weight: 400;\n\tcolor: var(--text-secondary);\n}\n\n.appointment-pay {\n\tfont-variant-numeric: tabular-nums;\n}\n\n.appointment-meta {\n\talign-items: center;\n\tfont-size: var(--size-small);\n}\n\n.appointment-tier {\n\tcolor: var(--text-secondary);\n}\n\n/* A preview's short list of the year's appointments, the charted one in bold. */\n.preview .preview-subheading {\n\tmargin-top: 6px;\n\tcolor: var(--text-secondary);\n}\n\n.preview-appointments {\n\tlist-style: none;\n\tmargin: 0 0 3px;\n\tpadding: 0;\n\tfont-variant-numeric: tabular-nums;\n}\n\n.preview-appointments .charted {\n\tfont-weight: 600;\n}\n\n/* Sections behind disclosures inside a panel span its width. */\n.panel details.panel-section {\n\tmargin: 10px 0;\n}\n\n.panel details.panel-section > summary,\n.panel details.budget > summary {\n\tdisplay: flex;\n\twidth: 100%;\n\tfont-size: var(--size-label);\n\tfont-variant-numeric: tabular-nums;\n}\n\n.panel details.panel-section[open] > summary {\n\tmargin-bottom: 6px;\n}\n\n.panel details.budget {\n\tmargin: 6px 0;\n}\n\n.panel details.budget[open] {\n\tpadding-bottom: 6px;\n\tborder-bottom: 1px solid var(--gridline);\n}\n\n/* A union's line in a details panel, above its \"About the union\". */\n.panel .union-summary {\n\tmargin: 12px 0 6px;\n}\n\n/* A contract's or a union event's sources, under it: a disclosure as wide as its name, not the panel. */\n.panel details.item-sources {\n\tmargin: 6px 0 2px;\n}\n\n.panel details.item-sources > summary {\n\tdisplay: inline-flex;\n\twidth: auto;\n}\n\n.group-heading,\n.sources-heading {\n\tfont-size: 1em;\n\tfont-weight: 600;\n\tmargin: 12px 0 4px;\n}\n\n.item {\n\tborder-top: 1px solid var(--gridline);\n\tpadding-top: 8px;\n\tmargin-top: 8px;\n}\n\n.item-title {\n\tfont-size: 1em;\n\tfont-weight: 600;\n\tmargin: 0 0 2px;\n}\n\n.source {\n\tmargin-bottom: 8px;\n}\n\n.source-title {\n\tmargin: 0;\n}\n\n.source blockquote {\n\tmargin: 6px 0;\n\tpadding: 4px 10px;\n\tborder-left: 3px solid var(--baseline);\n\tcolor: var(--text-secondary);\n\tfont-style: italic;\n}\n\n.links {\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\tgap: 4px 14px;\n}\n\n/* Targets of at least 24 px everywhere, and 44 px on phones. */\n.links a,\n.network-links a,\n.living-wage a,\n.license a,\n.reason a {\n\tdisplay: inline-flex;\n\talign-items: center;\n\tmin-height: 24px;\n}\n\n/* On phones a reason's link takes a line of its own, so its 44 px target leaves the sentence's lines even. */\n.root[data-layout=\"narrow\"] .reason a {\n\tdisplay: flex;\n\twidth: fit-content;\n}\n\n.root[data-layout=\"narrow\"] :is(select, .picker-search, .segmented button, .copy-button, .button-link, .disclosure > summary, .close, .close-end, .skip-link, .cell-button, .timeline-row, .chip) {\n\tmin-height: 44px;\n}\n\n.root[data-layout=\"narrow\"] :is(.links a, .network-links a, .living-wage a, .license a, .byline a, .reason a, .back-to-contents, .link-button) {\n\tmin-height: 44px;\n}\n\n.root[data-layout=\"narrow\"] .picker-list label {\n\tmin-height: 44px;\n}\n\n/* Selects and the search box at 16 px on phones, so iOS doesn't zoom the page when they are tapped. */\n.root[data-layout=\"narrow\"] :is(select, .picker-search) {\n\tfont-size: 16px;\n}\n\n.root[data-layout=\"narrow\"] .close {\n\tmin-width: 44px;\n}\n\n.root[data-layout=\"narrow\"] .cell-button {\n\twidth: 100%;\n}\n\n.trend-wrap {\n\tmargin: 10px 0;\n}\n\n.trend-title {\n\tcolor: var(--text-secondary);\n\tmargin-bottom: 2px;\n}\n\n.trend {\n\tdisplay: block;\n\tmax-width: 100%;\n\toverflow: visible;\n\tforced-color-adjust: none;\n}\n\n.trend text {\n\tfont-size: var(--size-small);\n\tfont-variant-numeric: tabular-nums;\n}\n\n.trend-axis {\n\tfill: var(--text-muted);\n}\n\n.trend-value {\n\tfill: var(--text-secondary);\n}\n\n.trend-value.current,\n.trend-axis.current {\n\tfill: var(--text-primary);\n\tfont-weight: 600;\n}\n\n.trend-baseline {\n\tstroke: currentColor;\n\tstroke-opacity: var(--baseline-opacity);\n\tstroke-width: 1;\n}\n\n.trend-break {\n\tstroke: var(--text-muted);\n\tstroke-width: 1;\n}\n\n.trend-line {\n\tstroke: var(--text-secondary);\n\tstroke-width: 2;\n\tstroke-linecap: round;\n}\n\n.trend-line.scheduled {\n\tstroke-dasharray: 4 3;\n}\n\n.trend-dot {\n\tfill: var(--text-secondary);\n\tstroke: var(--panel-surface);\n\tstroke-width: 2;\n}\n\n.trend-dot.scheduled {\n\tfill: var(--panel-surface);\n\tstroke: var(--text-secondary);\n\tstroke-width: 1.5;\n}\n\n.trend-dot.current.series-contract {\n\tfill: var(--series-contract);\n}\n\n.trend-dot.current.series-policy {\n\tfill: var(--series-policy);\n}\n\n.trend-notes {\n\tmargin: 4px 0 0;\n\tpadding-left: 18px;\n\tcolor: var(--text-secondary);\n}\n\n/* The over-time view: a line for each chosen school, in the dataviz palette's eight categorical colours in their\n   fixed order, each school keeping its colour while it stays chosen. Validated with validate_palette.js against the\n   widget's surfaces: on white, adjacent pairs' colour-blind \u0394E 9.1 at worst and normal-vision \u0394E 19.6; on #1a1a19,\n   8.4 and 19.3, every colour 3:1 or more. Light slots 3 to 5 are under 3:1 against white, and any two lines can cross,\n   so no line relies on colour: each has its own point shape, the legend names every line, up to four have their names\n   at their ends, and the table gives every value. */\n.root {\n\t--line-1: #2a78d6;\n\t--line-2: #eb6834;\n\t--line-3: #1baf7a;\n\t--line-4: #eda100;\n\t--line-5: #e87ba4;\n\t--line-6: #008300;\n\t--line-7: #6250d6;\n\t--line-8: #e34948;\n}\n\n.root[data-theme=\"dark\"] {\n\t--line-1: #3987e5;\n\t--line-2: #d95926;\n\t--line-3: #199e70;\n\t--line-4: #c98500;\n\t--line-5: #d55181;\n\t--line-6: #008300;\n\t--line-7: #9085e9;\n\t--line-8: #e66767;\n}\n\n.ot-slot-1 {\n\t--ot-colour: var(--line-1);\n}\n\n.ot-slot-2 {\n\t--ot-colour: var(--line-2);\n}\n\n.ot-slot-3 {\n\t--ot-colour: var(--line-3);\n}\n\n.ot-slot-4 {\n\t--ot-colour: var(--line-4);\n}\n\n.ot-slot-5 {\n\t--ot-colour: var(--line-5);\n}\n\n.ot-slot-6 {\n\t--ot-colour: var(--line-6);\n}\n\n.ot-slot-7 {\n\t--ot-colour: var(--line-7);\n}\n\n.ot-slot-8 {\n\t--ot-colour: var(--line-8);\n}\n\n/* Its Per year | Per month switch, over the legend. */\n.unit-control {\n\tmargin: 0 0 10px;\n}\n\n/* The chart, with the points' buttons over it. */\n.ot-plot {\n\tposition: relative;\n\tmax-width: 100%;\n\tmargin: 4px 0 8px;\n}\n\n.over-time-chart {\n\tdisplay: block;\n\toverflow: visible;\n\tforced-color-adjust: none;\n}\n\n.over-time-chart text {\n\tfont-size: var(--size-small);\n\tfont-variant-numeric: tabular-nums;\n}\n\n.ot-tick,\n.ot-year {\n\tfill: var(--text-muted);\n}\n\n.ot-year.selected,\n.ot-label {\n\tfill: var(--text-primary);\n\tfont-weight: 600;\n}\n\n.ot-label {\n\tfont-variant-numeric: normal;\n}\n\n.ot-selected {\n\tstroke: var(--text-secondary);\n\tstroke-width: 1;\n}\n\n.ot-crosshair,\n.ot-leader {\n\tstroke: var(--text-muted);\n\tstroke-width: 1;\n}\n\n.ot-line,\n.ot-key-line {\n\tfill: none;\n\tstroke: var(--ot-colour);\n\tstroke-width: 2;\n\tstroke-linecap: round;\n}\n\n.ot-key-line {\n\tstroke: var(--text-secondary);\n}\n\n/* Scheduled years: a dashed line (square ends, so the gaps stay open) into hollow points. */\n.ot-line.scheduled,\n.ot-key-line.scheduled {\n\tstroke-linecap: butt;\n\tstroke-dasharray: 5 3;\n}\n\n/* Points carry a 2 px ring of the surface where they cross a line; the one hovered or focused grows. */\n.ot-point,\n.ot-key-point {\n\tfill: var(--ot-colour);\n\tstroke: var(--surface);\n\tstroke-width: 4;\n\tpaint-order: stroke;\n\tstroke-linejoin: round;\n}\n\n.ot-key-point {\n\tfill: var(--text-secondary);\n}\n\n.ot-point.scheduled {\n\tfill: var(--surface);\n\tstroke: var(--ot-colour);\n\tstroke-width: 1.5;\n\tpaint-order: normal;\n}\n\n/* A labelled figure's point (one school's or department's, or a continued rate) has a ring in its line's colour. */\n.ot-ring,\n.ot-key-ring {\n\tfill: none;\n\tstroke: var(--ot-colour);\n\tstroke-width: 1.5;\n}\n\n.ot-key-ring {\n\tstroke: var(--text-secondary);\n}\n\n.ot-point.active {\n\ttransform-box: fill-box;\n\ttransform-origin: center;\n\ttransform: scale(1.45);\n}\n\n/* The points' buttons take the keyboard and show its focus; the pointer goes through them to each point's part of\n   the chart under them (.ot-hit), shaped so that no two points' parts overlap. */\n.ot-points,\n.ot-hits {\n\tposition: absolute;\n\tinset: 0;\n\tpointer-events: none;\n}\n\n.ot-hit {\n\tposition: absolute;\n\tpointer-events: auto;\n\tcursor: pointer;\n}\n\n.ot-point-button {\n\tposition: absolute;\n\twidth: 24px;\n\theight: 24px;\n\tmargin: 0;\n\tpadding: 0;\n\tborder: none;\n\tborder-radius: 50%;\n\tbackground: transparent;\n\tpointer-events: none;\n}\n\n.ot-point-button:focus-visible,\n.ot-point-button[aria-expanded=\"true\"] {\n\toutline: 2px solid var(--focus);\n\toutline-offset: 0;\n}\n\n/* The values as a table: years down, schools across, scrolling sideways on a narrow screen. */\n.ot-table-details {\n\tmargin: 4px 0 12px;\n}\n\n.ot-table-wrap {\n\tmax-width: 100%;\n\tmargin-top: 8px;\n\toverflow-x: auto;\n}\n\n.ot-table {\n\twidth: auto;\n\tfont-size: var(--size-label);\n\tfont-variant-numeric: tabular-nums;\n}\n\n.ot-table caption {\n\tfont-weight: 400;\n\tcolor: var(--text-secondary);\n}\n\n.ot-table th,\n.ot-table td {\n\tpadding: 4px 10px;\n\twhite-space: nowrap;\n}\n\n.ot-table td {\n\ttext-align: right;\n}\n\n/* A figure's labels, under its amount, in a column wide enough that a label takes no more than two lines. */\n.ot-cell-tags {\n\tdisplay: block;\n\tmin-width: 9em;\n\tmax-width: 16em;\n\tmargin-left: auto;\n\tcolor: var(--text-secondary);\n\tfont-size: var(--size-small);\n\twhite-space: normal;\n}\n\n.ot-table tbody th {\n\tfont-weight: 400;\n}\n\n.ot-table tr.selected th,\n.ot-table tr.selected td {\n\tbackground: var(--selected);\n}\n\n/* As the charts' other marks (see the note above the bar charts' block below): repeated where Dark Reader leaves them\n   alone, so they keep the th
