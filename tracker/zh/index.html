eme's palette. The points' halo and the hollow points' fill are the widget's surface, or,\n   while Dark Reader darkens the page, its darkened background (--ot-halo, set by the widget), never the light theme's\n   white; the grey keys and the year lines are left for Dark Reader to adjust with the page's text. */\n@media (forced-colors: none) {\n\t@scope (.root) {\n\t\t.ot-line,\n\t\t.ot-ring {\n\t\t\tstroke: var(--ot-colour);\n\t\t}\n\n\t\t.ot-point {\n\t\t\tfill: var(--ot-colour);\n\t\t\tstroke: var(--ot-halo, var(--surface));\n\t\t}\n\n\t\t.ot-key-point {\n\t\t\tstroke: var(--ot-halo, var(--surface));\n\t\t}\n\n\t\t.ot-point.scheduled {\n\t\t\tfill: var(--ot-halo, var(--surface));\n\t\t\tstroke: var(--ot-colour);\n\t\t}\n\t}\n}\n\n/* Forced colours: every line in the text colour, told apart by its points' shapes, its name and the legend; the\n   selected year in the highlight colour. */\n@media (forced-colors: active) {\n\t.over-time-chart text,\n\t.ot-year.selected,\n\t.ot-label {\n\t\tfill: CanvasText;\n\t}\n\n\t.ot-line,\n\t.ot-key-line {\n\t\tstroke: CanvasText;\n\t}\n\n\t.ot-point,\n\t.ot-key-point {\n\t\tfill: CanvasText;\n\t\tstroke: Canvas;\n\t}\n\n\t.ot-point.scheduled {\n\t\tfill: Canvas;\n\t\tstroke: CanvasText;\n\t}\n\n\t.ot-ring,\n\t.ot-key-ring {\n\t\tstroke: CanvasText;\n\t}\n\n\t.ot-selected {\n\t\tstroke: Highlight;\n\t}\n\n\t.ot-crosshair,\n\t.ot-leader {\n\t\tstroke: GrayText;\n\t}\n}\n\n/* Living costs in a details panel. A school's other campuses, which the charts leave out, follow its own. */\n.item-title.other-campuses {\n\tmargin-top: 10px;\n}\n\n.campus-rents dd {\n\tfont-variant-numeric: tabular-nums;\n}\n\n.campus-rents .area {\n\tdisplay: block;\n\tcolor: var(--text-muted);\n\tfont-size: var(--size-small);\n}\n\n.living-wage {\n\tmargin: 6px 0;\n}\n\n.living-wage p {\n\tmargin: 0 0 2px;\n}\n\n/* Other campuses' counties: wrapped in a line on wide layouts, one to a line (each a 44 px target) on phones. */\n.county-links {\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\tgap: 0 14px;\n\tmargin: 0;\n\tpadding: 0;\n\tlist-style: none;\n}\n\n.root[data-layout=\"narrow\"] .county-links {\n\tdisplay: block;\n}\n\n.budget-name {\n\tmargin: 6px 0 0;\n\tcolor: var(--text-secondary);\n}\n\n/* Where Dark Reader darkens the page (a site without its own dark mode; the standalone page and sites with one lock it\n   out), it restyles the colours in the widget's shadow root as it does the page's, treating every fill and stroke as\n   text: dark fills turn light and pale ones bright, which inverts the charts' encodings (a pale summer segment or a\n   contract whose terms still apply would outshine one in force). So the marks' colours are repeated here inside\n   @scope, which Dark Reader 4.9 does not restyle and whose rules outrank its overrides by scoping proximity, so the\n   marks keep the palette of the theme the widget shows: dark with Auto, which follows Dark Reader there, or the\n   reader's explicit choice. Browsers without @scope use the rules above, which mean the same. Gridlines and baselines\n   are faint strokes of the text colour, and the timeline's event marks and the per-month view's living-cost marks are\n   inked in a text colour (hollow ones have no fill), so they are left out of this block: Dark Reader recolours them as\n   it does the text, which keeps them readable on the surface it gives the widget whichever theme the widget shows,\n   the light one included. Forced colours use their own rules below. */\n@media (forced-colors: none) {\n\t@scope (.root) {\n\t\t.bar.series-contract {\n\t\t\tfill: var(--series-contract);\n\t\t}\n\n\t\t.bar.series-policy {\n\t\t\tfill: var(--series-policy);\n\t\t}\n\n\t\t.bar.summer.series-contract {\n\t\t\tfill: var(--series-contract-light);\n\t\t\tstroke: var(--series-contract);\n\t\t}\n\n\t\t.bar.summer.series-policy {\n\t\t\tfill: var(--series-policy-light);\n\t\t\tstroke: var(--series-policy);\n\t\t}\n\n\t\t.extension {\n\t\t\tfill: none;\n\t\t\tstroke: var(--text-m 			const labelKey = element("div", { class: "label-key" });
			const explainerLink = sectionLinker();
			const details = disclosure({ class: "table-details", open: !isNarrow() }, (open) => text.toggle(open, data.institutions.length), [
				element("p", { class: "table-intro" }, [element("span", { class: "wide-only", text: text.hintWide }), element("span", { class: "narrow-only", text: text.hintNarrow })]),
				disclosure({ class: "how-to-read" }, () => strings.howToReadTable, [
					...text.explainer.map((paragraph) => element("p", { class: "table-explainer" }, explainerLink(paragraph))),
					element("p", { class: "table-explainer wide-only", text: text.keyboardHint }),
					labelKey,
				]),
				element("div", { class: "table-controls" }, [
					element("label", { class: "filter-control" }, [element("span", { text: text.show }), filterSelect]),
					element("label", { class: "sort-control" }, [element("span", { text: text.sortBy }), sortSelect]),
				]),
				wrap,
			]);
			let cards = isNarrow();
			let wideWidth = 0;
			details.addEventListener("toggle", () => {
				if (details.open && !isNarrow()) renderBody();
			});
			function contractRank(institution) {
				const order = Object.keys(strings.contractMeanings);
				const { meaning } = representationIn(institution, state.year);
				return institution.representation.kind === "union-contract" && order.includes(meaning) ? order.indexOf(meaning) : order.length;
			}
			function updateHeader() {
				for (const { column, button, label, cell } of headerCells) {
					button.textContent = column.label();
					label.textContent = column.label();
					cell.setAttribute("aria-sort", state.sort.key === column.key ? state.sort.direction : "none");
				}
				sortSelect.replaceChildren(...sortOptions.map((value) => element("option", { value, text: orderName(...value.split(":")) })));
				sortSelect.value = `${state.sort.key}:${state.sort.direction}`;
				caption.textContent = text.caption(state.year);
				const toCheck = filteredSchools(data.institutions).filter((institution) => statusOf(institution).state === "check").length;
				const options = [
					["all", filtering() ? text.filterHighlighted(state.highlighted.size) : text.filterAll(data.institutions.length)],
					state.highlighted.size && !filtering() ? ["highlighted", text.filterHighlighted(state.highlighted.size)] : null,
					toCheck ? ["check", text.filterCheck(toCheck)] : null,
				].filter(Boolean);
				if (!options.some(([value]) => value === state.tableFilter)) state.tableFilter = "all";
				filterSelect.replaceChildren(...options.map(([value, label]) => element("option", { value, selected: value === state.tableFilter, text: label })));
				filterSelect.value = state.tableFilter;
				updateLabelKey();
			}
			function updateLabelKey() {
				const contractOrder = Object.keys(strings.contractMeanings);
				const contractLabels = new Map();
				for (const institution of data.institutions) {
					const { label, meaning } = representationIn(institution, state.year);
					if (strings.contractMeanings[meaning] && !contractLabels.has(label)) contractLabels.set(label, meaning);
				}
				const contractEntries = [...contractLabels].sort(([, first], [, second]) => contractOrder.indexOf(first) - contractOrder.indexOf(second));
				const termKeys = new Set(data.institutions.flatMap((institution) => TERM_KEYS.map((key) => termView(institution, key, state.year)?.label_key)).filter(Boolean));
				const termEntries = Object.keys(strings.terms.meanings)
					.filter((key) => termKeys.has(key) && strings.terms.labels[key])
					.map((key) => [strings.terms.labels[key], key]);
				const group = (title, entries, meaningOf) =>
					entries.length
						? element("div", { class: "key-group" }, [
								element("p", { class: "key-group-title", text: title }),
								element(
									"dl",
									{},
									entries.map(([label, key]) => element("div", {}, [element("dt", {}, keepYearsWhole(strings.runIn(label))), element("dd", { text: meaningOf(key) })])),
								),
							])
						: null;
				const groups = [group(text.unionContract, contractEntries, (key) => strings.contractMeanings[key]), group(text.keyTerms, termEntries, (key) => strings.terms.meanings[key])].filter(Boolean);
				labelKey.replaceChildren(...(groups.length ? [element(headingLevel(4), { class: "key-heading", text: text.keyHeading }), element("div", { class: "key-groups" }, groups)] : []));
			}
			function announceSort() {
				announce(text.sorted(orderName(state.sort.key, state.sort.direction)));
			}
			function cellButton(main, extras, column, value, handlers, institution) {
				const name = (cards ? text.cardCellName(institution.name, column, value) : value).replaceAll("\u200b", "");
				const button = element("button", { type: "button", class: "cell-button", "aria-label": strings.showDetails(name) }, [element("span", { class: "main" }, withTrailing(main, chevron())), ...extras]);
				popups.attach(button, handlers);
				return button;
			}
			function muted(content) {
				return element("span", { class: "muted" }, keepYearsWhole(content));
			}
			function livingHandlers(institution) {
				return { preview: () => livingPreview(institution, state.year), details: () => livingDetails(institution, state.year) };
			}
			function shareBar(value, width = RENT_SHARE_BAR.width, overflow = RENT_SHARE_BAR.overflow) {
				const { height, top, thickness } = RENT_SHARE_BAR;
				const scale = (portion) => Math.min(portion / RENT_SHARE_BAR_MAXIMUM, 1) * width;
				const line = scale(RENT_BURDEN_SHARE);
				const end = Math.max(scale(value), 2);
				const overflows = value > RENT_SHARE_BAR_MAXIMUM;
				const svg = svgElement("svg", { class: "share-bar", width: width + overflow, height, viewBox: `0 0 ${width + overflow} ${height}`, "aria-hidden": "true", focusable: "false" });
				svg.append(
					svgElement("path", { class: "share-track", d: shareSegment(0, width, true, true) }),
					svgElement("path", { class: "share-fill", d: shareSegment(0, Math.min(end, line), true, value <= RENT_BURDEN_SHARE) }),
				);
				if (value > RENT_BURDEN_SHARE) svg.append(svgElement("path", { class: "share-fill over", d: shareSegment(line, end, false, !overflows) }));
				if (overflows) svg.append(svgElement("path", { class: "share-fill over", d: `M${width},${top - 1.5}L${width + overflow},${top + thickness / 2}L${width},${top + thickness + 1.5}Z` }));
				svg.append(svgElement("line", { class: "share-tick", x1: line, x2: line, y1: 0, y2: height }));
				return svg;
			}
			function shareSegment(start, end, roundStart, roundEnd) {
				const { top, thickness } = RENT_SHARE_BAR;
				const half = thickness / 2;
				const room = (end - start) / (roundStart && roundEnd ? 2 : 1);
				const left = roundStart ? Math.min(half, room) : 0;
				const right = roundEnd ? Math.min(half, room) : 0;
				return [
					`M${start + left},${top}H${end - right}`,
					right ? `A${right},${half} 0 0 1 ${end - right},${top + thickness}` : `V${top + thickness}`,
					`H${start + left}`,
					left ? `A${left},${half} 0 0 1 ${start + left},${top}` : `V${top}`,
					"Z",
				].join("");
			}
			function shareKey() {
				const glyph = shareBar(0.7, 24, 0);
				glyph.setAttribute("class", "share-glyph");
				const key = element("span", { class: "share-key", "aria-hidden": "true" }, [glyph, element("span", { text: text.shareKey })]);
				key.style.setProperty("--share-line", `${(RENT_SHARE_BAR.width * RENT_BURDEN_SHARE) / RENT_SHARE_BAR_MAXIMUM}px`);
				return key;
			}
			function rentCell(institution, label) {
				const summary = livingSummary(institution, state.year);
				if (!summary || summary.rent === null) return { cell: element("td", { class: "number", "data-label": label }, muted(text.noRent)), button: null };
				const rentShare = summary.rentShare;
				let button;
				if (rentShare !== null) {
					const value = share(rentShare);
					const handlers = livingHandlers(institution);
					const preview = () => {
						const content = handlers.preview();
						return content && [...content, element("p", { class: "muted", text: text.shareMarkNote })];
					};
					button = cellButton(
						[element("span", { class: "nowrap", text: value })],
						[shareBar(rentShare), shareKey()],
						label,
						[value, rentShare > RENT_BURDEN_SHARE ? text.aboveLine : text.belowLine].join(strings.listSeparator),
						{ ...handlers, preview },
						institution,
					);
				} else {
					const gap = payGapText(institution, state.year, "year", false) || text.noRent;
					button = cellButton([muted(gap)], [], label, gap, livingHandlers(institution), institution);
				}
				return { cell: element("td", { class: "number", "data-label": label }, button), button };
			}
			function estimateCell(institution, label) {
				const summary = livingSummary(institution, state.year);
				const budgets = summary ? summary.costs.budgets : [];
				const combined = summary ? summary.costs.combined_budgets : [];
				if (!budgets.length && combined.length) {
					const gap = strings.living.combinedShort;
					const button = cellButton([muted(gap)], [], label, gap, livingHandlers(institution), institution);
					return { cell: element("td", { class: "number", "data-label": label }, button), button };
				}
				if (!budgets.length) return { cell: element("td", { class: "number", "data-label": label }, muted(text.noEstimate)), button: null };
				const payShare = summary.payShare;
				let button;
				if (payShare !== null) {
					const basis = budgets[0].pay_share_basis;
					const scopes = [basis ? strings.living.perTermTag(strings.units[basis.per] || basis.per) : null, summary.partial ? strings.living.partialTag : null].filter(Boolean);
					const value = share(payShare);
					button = cellButton(
						[element("span", { class: "nowrap", text: value })],
						[scopes.length ? element("span", { class: "scope", text: scopes.join(strings.separator) }) : null],
						label,
						[value, ...scopes].join(strings.listSeparator),
						livingHandlers(institution),
						institution,
					);
				} else {
					const gap = summary.estimate !== null ? payGapText(institution, state.year, "month", false) || text.periodNotStated : text.periodNotStated;
					button = cellButton([muted(gap)], [], label, gap, livingHandlers(institution), institution);
				}
				return { cell: element("td", { class: "number", "data-label": label }, button), button };
			}
			function nameCell(institution) {
				const status = statusOf(institution);
				const label = status.state === "check" ? strings.status.check : strings.status.current;
				const marker = element(
					"button",
					{ type: "button", class: `cell-button status-marker ${status.state}`, "aria-label": strings.showDetails(cards ? text.cardCellName(institution.name, text.statusColumn, label) : label) },
					[statusIcon(status.state), element("span", { class: "main", text: label }), chevron()],
				);
				popups.attach(marker, {
					preview: () => [
						element("p", { class: "preview-title" }, nameNode(institution)),
						element("p", { class: "preview-value" }, [statusIcon(status.state), ` ${label}`]),
						...status.reasons.map((reason) => element("p", {}, keepYearsWhole(reasonText(reason)))),
					],
					details: () => statusDetails(institution),
				});
				const unions = unionLine(institution, "union-line");
				return {
					cell: element("th", { scope: "row" }, [
						element("span", { class: "school-name" }, nameNode(institution)),
						institution.state ? element("span", { class: "muted", text: ` ${institution.state}` }) : null,
						unions,
						element("span", { class: "status-line" }, marker),
					]),
					button: marker,
					links: unions ? [...unions.querySelectorAll("a")] : [],
				};
			}
			function renderRow(institution) {
				const year = state.year;
				const shown = shownPay(institution);
				const value = shown ? valueFor(shown.figure, state.mode) : null;
				const payLabel = columns[1].label();
				let payCell;
				let payButton = null;
				if (value !== null) {
					const { figure } = shown;
					const label = figureLabel(figure, state.mode, false, true);
					if (figure.summer) label.tags.unshift(strings.tags.withSummer);
					const lagging = shown.year !== year;
					const tags = [lagging ? strings.status.showingYear(shown.year) : null, ...label.tags].filter(Boolean);
					payButton = cellButton(
						label.main.map((part, index) => element("span", { class: "nowrap", text: index ? `${strings.separator}${part}` : part })),
						[tags.length ? element("span", { class: "scope" }, keepYearsWhole(tags.join(strings.separator.replace(/^ /, "\u00a0")))) : null],
						payLabel,
						[labelText(label), lagging ? strings.status.noRate(year, shown.year) : null].filter(Boolean).join(strings.listSeparator),
						{
							preview: () => payPreview(institution, figure, state.mode, null, shown.year),
							details: () => payDetails(institution, figure, state.mode, shown.year),
						},
						institution,
					);
					payCell = element("td", { class: "number", "data-label": payLabel }, payButton);
				} else if (!institution.pay[year] && institution.no_figure[year]) {
					const view = institution.no_figure[year];
					payButton = cellButton(keepYearsWhole(view.short), [], payLabel, view.short, { preview: () => noFigurePreview(institution, year), details: () => noFigureDetails(institution, year) }, institution);
					payCell = element("td", { class: "number", "data-label": payLabel }, payButton);
				} else {
					let content = missingFigureText(institution, year, false);
					if (institution.pay[year]) content = text.noFigureForUnit(strings.modeAdjective[state.mode]);
					payCell = element("td", { class: "number", "data-label": payLabel }, muted(content));
				}
				const name = nameCell(institution);
				const rent = rentCell(institution, text.rentShare);
				const estimate = estimateCell(institution, text.payShare);
				const contractLabel = representationIn(institution, year).label;
				const contractButton = cellButton(keepYearsWhole(contractLabel), [], text.unionContract, contractLabel, {
					preview: () => representationPreview(institution, year),
					details: () => representationDetails(institution, year),
				}, institution);
				const termButtons = TERM_KEYS.map((key) => {
					const view = termView(institution, key, year);
					if (!view) return null;
					const otherLine = otherTermLine(institution, key, year);
					return cellButton(
						[termLabelNode(view)],
						[view.scope ? element("span", { class: "scope", lang: langOf(view.scope_language), text: view.scope }) : null, otherLine ? element("span", { class: "scope other-term" }, keepYearsWhole(otherLine)) : null],
						strings.terms[key].label,
						[termLabel(view), view.scope ? strings.terms.scopeName(view.scope) : null, otherLine].filter(Boolean).join(strings.listSeparator),
						{
							preview: () => termPreview(institution, key, view),
							details: () => termDetails(institution, key, view),
						},
						institution,
					);
				});
				const row = element("tr", { "data-key": institution.id, class: emphasisClass(institution).trim() || null }, [
					name.cell,
					payCell,
					rent.cell,
					estimate.cell,
					element("td", { class: "contract", "data-label": text.unionContract }, contractButton),
					...TERM_KEYS.map((key, index) => element("td", { "data-label": strings.terms[key].label }, termButtons[index] || muted(text.notResearched))),
				]);
				return { row, links: name.links, buttons: [name.button, payButton, rent.button, estimate.button, contractButton, ...termButtons] };
			}
			function drawRows() {
				const column = columns.find((candidate) => candidate.key === state.sort.key);
				const shownSchools = filteredSchools(data.institutions).filter((institution) => {
					if (state.tableFilter === "highlighted") return state.highlighted.has(institution.id);
					if (state.tableFilter === "check") return statusOf(institution).state === "check";
					return true;
				});
				const ranked = [];
				const soft = [];
				const unknown = [];
				for (const institution of shownSchools) {
					const value = column.sortValue(institution);
					if (value === null || value === undefined) unknown.push(institution);
					else if (column.key === "pay" && institution.pay[state.year]?.soft) soft.push(institution);
					else ranked.push(institution);
				}
				const order = (first, second) => {
					const firstValue = column.sortValue(first);
					const secondValue = column.sortValue(second);
					const difference = typeof firstValue === "number" ? firstValue - secondValue : collator.compare(String(firstValue), String(secondValue));
					return (state.sort.direction === "ascending" ? difference : -difference) || byName(first, second);
				};
				ranked.sort(order);
				soft.sort(order);
				unknown.sort(byName);
				const groups = [
					{ rows: ranked, divider: null },
					{ rows: soft, divider: text.softDivider },
					{ rows: unknown, divider: column.key === "pay" ? text.divider(strings.modeAdjective[state.mode], state.year) : null },
				];
				const rendered = [];
				const rows = [];
				for (const group of groups) {
					if (!group.rows.length) continue;
					if (group.divider && rows.length) rows.push(element("tr", { class: "divider" }, element("td", { colspan: columns.length }, keepYearsWhole(group.divider))));
					for (const institution of group.rows) {
						const entry = { institution, ...renderRow(institution) };
						rendered.push(entry);
						rows.push(entry.row);
					}
				}
				body.replaceChildren(...rows);
				tableGrid(rendered);
			}
			function renderBody() {
				popups.closeAll();
				const narrow = isNarrow();
				cards = narrow;
				details.classList.toggle("cards", cards);
				wrap.classList.remove("fits");
				drawRows();
				if (narrow || !details.open || !wrap.clientWidth) return;
				wideWidth = tableElement.scrollWidth;
				if (wideWidth <= wrap.clientWidth + 1) wrap.classList.add("fits");
				else {
					cards = true;
					details.classList.add("cards");
					drawRows();
				}
			}
			function tableGrid(rendered) {
				const linkColumns = Math.max(0, ...rendered.map((entry) => entry.links.length));
				const grid = rendered.map((entry) => [...entry.links, ...Array(linkColumns - entry.links.length).fill(null), ...entry.buttons]);
				const all = grid.flat().filter(Boolean);
				if (!all.length) return;
				const keyOf = (rowIndex, columnIndex) => `${rendered[rowIndex].institution.id}:${columnIndex}`;
				let active = null;
				grid.forEach((buttons, rowIndex) =>
					buttons.forEach((button, columnIndex) => {
						if (!button) return;
						button.tabIndex = -1;
						button.dataset.cell = keyOf(rowIndex, columnIndex);
						if (keyOf(rowIndex, columnIndex) === state.activeCell) active = button;
						button.addEventListener("focus", () => {
							for (const other of all) other.tabIndex = -1;
							button.tabIndex = 0;
							state.activeCell = keyOf(rowIndex, columnIndex);
						});
						button.addEventListener("keydown", (event) => {
							let target = null;
							const rowButtons = grid[rowIndex];
							const find = (start, step, pick) => {
								for (let index = start; index >= 0 && index < (pick === "row" ? rowButtons.length : grid.length); index += step) {
									const candidate = pick === "row" ? rowButtons[index] : grid[index][columnIndex];
									if (candidate) return candidate;
								}
								return null;
							};
							if (event.key === "ArrowRight") target = find(columnIndex + 1, 1, "row");
							else if (event.key === "ArrowLeft") target = find(columnIndex - 1, -1, "row");
							else if (event.key === "ArrowDown") target = find(rowIndex + 1, 1, "column");
							else if (event.key === "ArrowUp") target = find(rowIndex - 1, -1, "column");
							else if (event.key === "Home") target = event.ctrlKey ? all[0] : find(0, 1, "row");
							else if (event.key === "End") target = event.ctrlKey ? all.at(-1) : find(rowButtons.length - 1, -1, "row");
							else return;
							event.preventDefault();
							if (target) target.focus();
						});
					}),
				);
				(active || all[0]).tabIndex = 0;
			}
			return {
				section: details,
				details,
				update() {
					updateHeader();
					renderBody();
				},
				relayout() {
					if (!details.open || isNarrow()) return;
					if (cards ? wideWidth <= wrap.clientWidth + 1 : tableElement.scrollWidth > wrap.clientWidth + 1) renderBody();
				},
				focusCell(key) {
					const button = body.querySelector(`[data-cell="${CSS.escape(key)}"]`);
					if (button) button.focus({ preventScroll: true });
				},
			};
		}
		highlight.place();
		render();
		renderTimeline();
		placeContents();
		updateCurrentSection();
		if (state.section) requestAnimationFrame(() => sectionHeadings[state.section] && goToSection(state.section, false));
	}
	function startAll() {
		for (const mount of document.querySelectorAll(".aun-contract-comparison")) start(mount);
	}
	if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", startAll);
	else startAll();
})();
})();
</script>
</body>
