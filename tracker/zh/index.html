const WIDGET_CSS = "/* Light theme tokens. The series colours are the dataviz palette's first two slots, validated for the light surface;\n   the dark theme below re-steps them for its surface. The contents list in the page's margin sits on the host page,\n   not on the widget's card, so it takes the tokens of the surface under it (data-surface, set by the script). */\n:host,\n.contents.side[data-surface=\"light\"] {\n\t--surface: #ffffff;\n\t--text-primary: #0b0b0b;\n\t--text-secondary: #52514e;\n\t--text-muted: #6f6d68;\n\t--gridline: #e1e0d9;\n\t--baseline: #c3c2b7;\n\t/* Chart gridlines and baselines are the text colour at these opacities (#e1e0d9 and #c3c2b7 on white), so Dark\n\t   Reader, which turns any solid stroke light, leaves them as faint as they are here. */\n\t--gridline-opacity: 0.12;\n\t--baseline-opacity: 0.25;\n\t--border: rgba(11, 11, 11, 0.1);\n\t--series-contract: #2a78d6;\n\t--series-contract-light: #86b6ef;\n\t--series-contract-continuing: #b7d3f6;\n\t--series-policy: #eb6834;\n\t--series-policy-light: #f3a07c;\n\t--series-superseded: #c3c2b7;\n\t--focus: #2a78d6;\n\t--link: #1c5cab;\n\t--selected: rgba(42, 120, 214, 0.08);\n\t--notice: #fdf4e3;\n\t--panel-surface: #ffffff;\n\t--panel-shadow: 0 6px 24px rgba(11, 11, 11, 0.14);\n\t/* Living-cost marks sit on the bars and off them, so they take the strongest ink, with a halo of the surface. */\n\t--living-mark: #0b0b0b;\n\t/* The \u25b2 beside rent above 30 percent of pay in a details panel. */\n\t--burden: #b3261e;\n\t/* Controls: a border with 3:1 contrast or more against the surface, and a quiet hover fill. */\n\t--control-border: #6f6d68;\n\t--control-surface: #ffffff;\n\t--control-hover: #eeede7;\n\t--chevron: #6f6d68;\n\t/* The faint band behind every other timeline row. */\n\t--band: rgba(11, 11, 11, 0.03);\n\t/* The tint behind the inline contents list, which sets it apart from the controls. */\n\t--contents-surface: #f5f4f0;\n}\n\n:host {\n\t/* Status colours are fixed in both themes and always come with an icon shape and text. */\n\t--status-good: #0ca30c;\n\t--status-warning: #fab219;\n\t/* The type scale: five sizes. */\n\t--size-title: 24px;\n\t--size-section: 19px;\n\t--size-body: 15px;\n\t--size-label: 13px;\n\t--size-small: 12px;\n\tdisplay: block;\n}\n\n/* Dark theme: the same roles stepped for a dark surface, the series colours re-validated against it. */\n.root[data-theme=\"dark\"],\n.contents.side[data-surface=\"dark\"] {\n\tcolor-scheme: dark;\n\t--surface: #1a1a19;\n\t--text-primary: #f0efec;\n\t--text-secondary: #c3c2b7;\n\t--text-muted: #a19f97;\n\t--gridline: #2c2c2a;\n\t--baseline: #5a5953;\n\t--gridline-opacity: 0.085;\n\t--baseline-opacity: 0.3;\n\t--border: rgba(255, 255, 255, 0.12);\n\t--series-contract: #3987e5;\n\t/* The summer end of a bar is lighter than the bar in both themes (\"the lighter end of the bar\"): here the series\n\t   colour 40 percent of the way to the text colour, 1.6:1 against the bar and 7.3:1 or more against the surface. */\n\t--series-contract-light: #82b1e8;\n\t--series-contract-continuing: #2a4a72;\n\t--series-policy: #d95926;\n\t--series-policy-light: #e29575;\n\t--series-superseded: #5a5953;\n\t--focus: #6aa6ee;\n\t--link: #8ab8f2;\n\t--selected: rgba(57, 135, 229, 0.18);\n\t--notice: #3a3020;\n\t--panel-surface: #242422;\n\t--panel-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);\n\t--living-mark: #f0efec;\n\t--burden: #ff8a80;\n\t--control-border: #8d8b84;\n\t--control-surface: #242422;\n\t--control-hover: #30302d;\n\t--chevron: #a19f97;\n\t--band: rgba(255, 255, 255, 0.035);\n\t--contents-surface: #222220;\n}\n\n/* The theme's rules for the host element (a div) beat :host, so the typography is set on the root instead. Line\n   height, letter spacing and word spacing are inherited from the mount, whose line height the snippet sets in the page,\n   so a reader's own text-spacing settings reach the widget. */\n.root {\n\tposition: relative;\n\tcolor-scheme: light;\n\tfont-family: \"Noto Sans\", \"Noto Sans SC\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n\tfont-size: var(--size-body);\n\tfont-weight: 400;\n\tfont-style: normal;\n\tline-height: inherit;\n\ttext-align: left;\n\ttext-transform: none;\n\ttext-indent: 0;\n\twhite-space: normal;\n\tcolor: var(--text-primary);\n\tbackground: var(--surface);\n\tpadding: 4px 0 12px;\n}\n\n/* Chinese: the site's Noto Sans for Latin text, then the platforms' Simplified Chinese fonts (macOS and iOS, Android\n   and Linux, Windows). First comes \"AUN CJK Punctuation\", which the script defines in the document (a shadow root\n   ignores @font-face) from the same Chinese fonts for the curly quotes, the dash and the ellipsis alone, so they are\n   drawn full width as in Chinese text, not with Noto Sans's narrow Latin forms. English text keeps those. */\n.root:lang(zh) {\n\tfont-family: \"AUN CJK Punctuation\", \"Noto Sans\", \"PingFang SC\", \"Noto Sans SC\", \"Microsoft YaHei\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n}\n\n.root:lang(zh) :lang(en) {\n\tfont-family: \"Noto Sans\", \"PingFang SC\", \"Noto Sans SC\", \"Microsoft YaHei\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n}\n\n/* On a dark page or a dark system setting the widget is its own dark panel. */\n.root[data-theme=\"dark\"] {\n\tborder-radius: 12px;\n\tpadding: 20px;\n}\n\n.root[data-theme=\"dark\"][data-layout=\"narrow\"] {\n\tpadding: 14px 10px;\n\tborder-radius: 8px;\n}\n\n/* On the standalone page the page itself takes the theme, so the widget needs no panel of its own in either, and\n   switching the theme leaves the layout where it is. */\n.root[data-standalone][data-theme] {\n\tpadding: 4px 0 12px;\n\tborder-radius: 0;\n}\n\n* {\n\tbox-sizing: border-box;\n}\n\n[hidden] {\n\tdisplay: none !important;\n}\n\nh1,\nh2,\nh3,\nh4,\nh5,\nh6 {\n\tfont-weight: 600;\n}\n\n/* Headings take their size from their class, not their level, which is one higher on the standalone page (its\n   title is the page's h1) than in the block (an h2 under the WordPress page's h1). */\n.section-heading:focus,\n.chart-heading:focus,\n.contents:focus {\n\toutline: none;\n}\n\n.block-heading,\n.panel-title {\n\tfont-size: 1em;\n\tmargin: 0;\n}\n\np {\n\tmargin: 0 0 8px;\n}\n\na {\n\tcolor: var(--link);\n}\n\n/* Header: the title, the computed lead, the byline and date, the contents list, the dek, the stat tiles and the\n   schools to check. */\n.widget-header {\n\tmargin-bottom: 8px;\n}\n\n.title-row {\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\talign-items: center;\n\tjustify-content: space-between;\n\tgap: 8px 16px;\n\tmargin-bottom: 6px;\n}\n\n.title {\n\tfont-size: var(--size-title);\n\tline-height: 1.2;\n\tmargin: 0;\n}\n\n.lead {\n\tfont-size: var(--size-section);\n\tline-height: 1.35;\n\tfont-weight: 500;\n\tmargin: 0 0 10px;\n\tmax-width: 46em;\n}\n\n.byline {\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\talign-items: center;\n\tgap: 4px 0;\n\tmargin: 0 0 12px;\n\tfont-size: var(--size-label);\n\tcolor: var(--text-secondary);\n}\n\n.byline a {\n\tdisplay: inline-flex;\n\talign-items: center;\n\tgap: 8px;\n\tcolor: var(--text-secondary);\n\ttext-decoration: none;\n}\n\n.byline a:hover span {\n\ttext-decoration: underline;\n\ttext-underline-offset: 3px;\n}\n\n.byline-separator {\n\tmargin: 0 6px;\n}\n\n/* On phones the date takes its own line, so the separator would dangle. */\n.root[data-layout=\"narrow\"] .byline-separator {\n\tdisplay: none;\n}\n\n.root[data-layout=\"narrow\"] .byline .updated {\n\tflex-basis: 100%;\n}\n\n.byline .logo {\n\tflex: none;\n\twidth: 28px;\n\theight: 28px;\n\tborder-radius: 50%;\n}\n\n.dek {\n\tcolor: var(--text-secondary);\n\tmax-width: 46em;\n\tmargin-bottom: 12px;\n}\n\n.stale-note,\n.preview-status,\n.status-title {\n\tdisplay: flex;\n\talign-items: center;\n\tgap: 6px;\n}\n\n/* A note that can wrap keeps its icon on its first line. */\n.stale-note {\n\talign-items: flex-start;\n\tfont-size: var(--size-label);\n\tcolor: var(--text-secondary);\n}\n\n.stale-note .status-icon {\n\tmargin-top: 2px;\n}\n\n.tiles {\n\tdisplay: grid;\n\tgrid-template-columns: repeat(auto-fit, minmax(180px, 1fr));\n\tgap: 12px;\n\tmargin: 0 0 12px;\n}\n\n.tile {\n\tborder-top: 1px solid var(--gridline);\n\tpadding-top: 8px;\n}\n\n.tile-value {\n\tfont-size: 28px;\n\tline-height: 1.15;\n\tfont-weight: 600;\n\tmargin: 0 0 4px;\n}\n\n.tile-label {\n\tfont-size: var(--size-label);\n\tcolor: var(--text-secondary);\n\tmargin: 0 0 4px;\n}\n\n/* In the tile's link's place while the chart shows rent as a share of pay: a line as tall as the link. */\n.tile-note {\n\tdisplay: flex;\n\talign-items: center;\n\tmin-height: 24px;\n\tmargin: 0;\n\tfont-size: var(--size-label);\n\tcolor: var(--text-muted);\n}\n\n.root[data-layout=\"narrow\"] .tile-note {\n\tmin-height: 44px;\n}\n\n.link-button {\n\tfont: inherit;\n\tfont-size: var(--size-label);\n\tcolor: var(--link);\n\tbackground: none;\n\tborder: none;\n\tpadding: 0;\n\tmin-height: 24px;\n\ttext-decoration: underline;\n\ttext-underline-offset: 3px;\n\tcursor: pointer;\n}\n\n/* The theme control: a small segmented switch beside the title. */\n.theme-control {\n\tdisplay: flex;\n\talign-items: center;\n\tgap: 8px;\n\tfont-size: var(--size-label);\n\tcolor: var(--text-secondary);\n}\n\n.segmented.compact button {\n\tfont-size: var(--size-small);\n\tmin-height: 28px;\n\tpadding: 3px 10px;\n}\n\n/* The status icon: a check mark on green for current data, a clock on amber for data to check. */\n.status-icon {\n\tflex: none;\n\tvertical-align: -2px;\n\tforced-color-adjust: none;\n}\n\n.status-current .status-disc {\n\tfill: var(--status-good);\n}\n\n.status-check .status-disc {\n\tfill: var(--status-warning);\n\tstroke: var(--text-secondary);\n\tstroke-width: 0.75;\n}\n\n.status-ink {\n\tfill: none;\n\tstroke-width: 1.6;\n\tstroke-linecap: round;\n\tstroke-linejoin: round;\n}\n\n.status-current .status-ink {\n\tstroke: #ffffff;\n}\n\n.status-check .status-ink {\n\tstroke: #0b0b0b;\n}\n\n.status-summary {\n\tmargin: 0 0 8px;\n}\n\n.to-check-list {\n\tmargin: 8px 0;\n\tpadding-left: 20px;\n}\n\n.to-check-list li {\n\tmargin: 4px 0;\n}\n\n.reason {\n\tmargin-right: 6px;\n}\n\n.status-block {\n\tmargin: 8px 0;\n\tpadding: 8px 10px;\n\tborder-left: 3px solid var(--baseline);\n}\n\n.status-block.check {\n\tborder-left-color: var(--status-warning);\n}\n\n.status-block .status-title {\n\tfont-size: 1em;\n\tmargin: 0 0 4px;\n}\n\n.status-block .reasons {\n\tmargin: 4px 0;\n\tpadding-left: 0;\n\tlist-style: none;\n}\n\n.status-block .reasons li {\n\tmargin: 3px 0;\n}\n\n/* The contents list: inline, a tinted panel of links under its heading, between the header's summary and the\n   controls, so it reads as the page's sections, not as more controls; or a panel fixed in the page's left margin when\n   the viewport leaves room (the script sets its position). */\n/* A link back to the list puts it below the window's top edge, so the focused link's ring shows whole. */\n.contents {\n\tmargin: 16px 0 20px;\n\tfont-size: var(--size-label);\n\tscroll-margin-top: var(--scroll-offset, 16px);\n}\n\n.contents:not(.side) {\n\tpadding: 10px 14px 8px;\n\tbackground: var(--contents-surface);\n\tborder: 1px solid var(--border);\n\tborder-radius: 8px;\n}\n\n/* The list's name, as a quiet heading over its links. */\n.contents-label {\n\tmargin: 0 0 6px;\n\tfont-size: var(--size-small);\n\tfont-weight: 600;\n\tcolor: var(--text-secondary);\n}\n\n.contents:not(.side) .contents-label {\n\tmargin: 0 0 4px;\n\tfont-size: var(--size-label);\n}\n\n.contents ul {\n\tmargin: 0;\n\tpadding: 0;\n\tlist-style: none;\n}\n\n/* Inline, the links line up in columns, as many as fit; on a narrow phone or at high zoom, one. */\n.contents:not(.side) ul {\n\tdisplay: grid;\n\tgrid-template-columns: repeat(auto-fill, minmax(min(12em, 100%), 1fr));\n\tgap: 0 20px;\n}\n\n.contents a {\n\tdisplay: inline-flex;\n\talign-items: center;\n\tmin-height: 24px;\n}\n\n.contents a[aria-current=\"location\"] {\n\tfont-weight: 600;\n\tcolor: var(--text-primary);\n}\n\n/* Inline, each link is a \u2193 and its underlined name, the whole row its target. */\n.contents:not(.side) a {\n\tdisplay: flex;\n\talign-items: baseline;\n\tgap: 6px;\n\tmin-height: 32px;\n\tpadding: 6px 0;\n\ttext-decoration: none;\n}\n\n.contents:not(.side) .contents-text {\n\ttext-decoration: underline;\n\ttext-decoration-thickness: 1px;\n\ttext-underline-offset: 3px;\n}\n\n@media (hover: hover) {\n\t.contents:not(.side) a:hover .contents-text {\n\t\ttext-decoration-thickness: 2px;\n\t}\n}\n\n.contents-cue {\n\tflex: none;\n}\n\n.contents.side .contents-cue {\n\tdisplay: none;\n}\n\n.contents.side {\n\tposition: fixed;\n\tz-index: 10;\n\tmargin: 0;\n\tpadding: 10px 0 10px 12px;\n\tborder-left: 1px solid var(--gridline);\n\tcolor: var(--text-primary);\n\ttransition: opacity 0.15s ease;\n}\n\n.contents.side[data-surface=\"light\"] {\n\tcolor-scheme: light;\n}\n\n/* Where the page's colour under the list leaves its links short of 4.5:1 contrast with either palette, the list takes\n   its palette's surface as a backdrop. */\n.contents.side.backdrop {\n\tpadding-right: 10px;\n\tbackground: var(--surface);\n\tborder: 1px solid var(--border);\n\tborder-radius: 6px;\n}\n\n.contents.side a {\n\tposition: relative;\n\tdisplay: flex;\n\tpadding: 2px 0;\n}\n\n/* The current section: a bar over the list's rule beside its link. */\n.contents.side a[aria-current=\"location\"]::before {\n\tcontent: \"\";\n\tposition: absolute;\n\tleft: -13px;\n\ttop: 2px;\n\tbottom: 2px;\n\twidth: 2px;\n\tbackground: var(--text-primary);\n}\n\n.contents.side.out-of-view:not(:focus-within) {\n\topacity: 0;\n\tpointer-events: none;\n}\n\n/* On phones each link is a 44 px row at body size, in one column unless two fit without wrapping a name. */\n.root[data-layout=\"narrow\"] .contents:not(.side) ul {\n\tgrid-template-columns: repeat(auto-fill, minmax(min(14em, 100%), 1fr));\n\tfont-size: var(--size-body);\n}\n\n.root[data-layout=\"narrow\"] .contents:not(.side) a {\n\talign-items: center;\n\tmin-height: 44px;\n\tpadding: 4px 0;\n}\n\n/* \"Back to contents\" at the end of each section: a small button, hidden (and out of the tab order) while the contents\n   list sits in the margin, where it is always in view. */\n.back-row {\n\tmargin: 10px 0 0;\n}\n\n.root.side-contents .back-row {\n\tdisplay: none;\n}\n\n.back-to-contents {\n\tdisplay: inline-flex;\n\talign-items: center;\n\tgap: 6px;\n\tmin-height: 28px;\n\tpadding: 2px 10px;\n\tfont-size: var(--size-label);\n\tcolor: var(--text-primary);\n\ttext-decoration: none;\n\tbackground: var(--control-surface);\n\tborder: 1px solid var(--control-border);\n\tborder-radius: 6px;\n}\n\n@media (hover: hover) {\n\t.back-to-contents:hover {\n\t\tbackground: var(--control-hover);\n\t}\n}\n\n/* With the button above it, a section's heading needs less space before it. */\n.root:not(.side-contents) .back-row + .section-heading,\n.root:not(.side-contents) .back-row + :is(.page-section, .landmark-section) > .section-heading:first-child {\n\tmargin-top: 24px;\n}\n\n@media (prefers-reduced-motion: reduce) {\n\t.contents.side {\n\t\ttransition: none;\n\t}\n}\n\n/* Section headings: a step up from body text, with space and a hairline above. */\n.section-heading {\n\tfont-size: var(--size-section);\n\tline-height: 1.3;\n\tmargin: 40px 0 12px;\n\tpadding-top: 16px;\n\tborder-top: 1px solid var(--gridline);\n\tscroll-margin-top: var(--scroll-offset, 16px);\n}\n\n/* The chart's heading is a section heading like its sibling h3s, without the rule above. */\n.chart-heading {\n\tfont-size: var(--size-section);\n\tmargin: 20px 0 4px;\n\tscroll-margin-top: var(--scroll-offset, 16px);\n}\n\n.chart-summary {\n\tcolor: var(--text-secondary);\n\tfont-size: var(--size-label);\n\tmax-width: 46em;\n\ttext-wrap: pretty;\n}\n\n/* Why a chart has no rows, in place of the chart. */\n.chart-empty {\n\tmargin: 8px 0 12px;\n\tfont-size: 14px;\n\tcolor: var(--text-secondary);\n\tmax-width: 46em;\n\ttext-wrap: pretty;\n}\n\n.subtitle,\n.footnote {\n\tcolor: var(--text-secondary);\n}\n\n/* The notice from the page text, one quiet line under the chart. */\n.page-notice {\n\tfont-size: var(--size-label);\n\tcolor: var(--text-secondary);\n\tmargin-top: 12px;\n\tmax-width: 46em;\n}\n\n.network-links {\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\tgap: 4px 18px;\n\tmargin: 0 0 8px;\n\tpadding: 0;\n\tlist-style: none;\n\tfont-size: var(--size-label);\n}\n\n/* On phones, a list of one link to a line, at body size. */\n.root[data-layout=\"narrow\"] .network-links {\n\tflex-direction: column;\n\tgap: 0;\n\tfont-size: var(--size-body);\n}\n\n/* The license badge and the suggested credit, under the download links. */\n.license a {\n\tdisplay: inline-flex;\n\talign-items: center;\n\tgap: 8px;\n}\n\n.license-icons {\n\tdisplay: inline-flex;\n\tgap: 2px;\n}\n\n.license-icon {\n\tdisplay: block;\n\tforced-color-adjust: none;\n}\n\n.suggested-credit {\n\tmargin: 4px 0 8px;\n}\n\n.page-section .credit-label {\n\tmargin: 0 0 4px;\n\tcolor: var(--text-primary);\n\tfont-weight: 600;\n}\n\n.credit-row {\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\talign-items: center;\n\tgap: 6px 10px;\n}\n\n.page-section .credit-text {\n\tmargin: 0;\n\tpadding: 4px 10px;\n\tborder-left: 3px solid var(--baseline);\n\tcolor: var(--text-primary);\n\tmax-width: 100%;\n}\n\n.copy-status {\n\tfont-size: var(--size-label);\n\tcolor: var(--text-secondary);\n}\n\n.page-section p {\n\tcolor: var(--text-secondary);\n\tmax-width: 46em;\n}\n\n.page-section strong {\n\tcolor: var(--text-primary);\n}\n\n.download-links {\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\tgap: 8px;\n\tmargin: 4px 0 12px;\n\tpadding: 0;\n\tlist-style: none;\n}\n\n.purpose ul {\n\tmargin: 0 0 8px;\n\tpadding-left: 20px;\n\tmax-width: 46em;\n\tcolor: var(--text-secondary);\n}\n\n.purpose li {\n\tmargin: 3px 0;\n}\n\n/* Loading and failure messages, which stand in for the widget so the page never shows a blank gap. */\n.message {\n\tmargin: 0;\n\tcolor: var(--text-secondary);\n}\n\n.footnote {\n\tfont-size: var(--size-small);\n\tmargin-top: 24px;\n}\n\n.muted {\n\tcolor: var(--text-muted);\n}\n\n/* A hidden sample of label text: its size changes with the reader's text spacing, which redraws the charts. */\n.spacing-probe {\n\tposition: absolute;\n\ttop: 0;\n\tleft: 0;\n\tvisibility: hidden;\n\tpointer-events: none;\n\twhite-space: nowrap;\n\tfont-size: var(--size-label);\n}\n\n.visually-hidden,\n.skip-link:not(:focus) {\n\tposition: absolute;\n\twidth: 1px;\n\theight: 1px;\n\tmargin: -1px;\n\tpadding: 0;\n\toverflow: hidden;\n\tclip: rect(0 0 0 0);\n\tclip-path: inset(50%);\n\twhite-space: nowrap;\n\tborder: 0;\n}\n\n/* Shown over the header when focused, so nothing moves. */\n.skip-link {\n\tposition: absolute;\n\ttop: 4px;\n\tleft: 0;\n\tz-index: 40;\n\tfont: inherit;\n\tcolor: var(--link);\n\tbackground: var(--panel-surface);\n\tborder: 1px solid var(--border);\n\tborder-radius: 6px;\n\tpadding: 4px 10px;\n\tcursor: pointer;\n}\n\nbutton {\n\tfont: inherit;\n\tcolor: inherit;\n}\n\n/* A reader's text spacing reaches the text in controls too, which browsers otherwise reset. */\nbutton,\nselect,\ninput {\n\tletter-spacing: inherit;\n\tword-spacing: inherit;\n}\n\n.controls {\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\tgap: 12px 20px;\n\talign-items: flex-start;\n\tmargin: 20px 0 8px;\n}\n\n.controls label,\n.sort-control,\n.filter-control {\n\tcolor: var(--text-secondary);\n\tfont-size: var(--size-label);\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\tgap: 4px 8px;\n\talign-items: center;\n\tmax-width: 100%;\n}\n\n/* The view switch and its description take a fixed width, so the highlight control beside them stays in place as the\n   description changes with the view. */\n.view-control {\n\tdisplay: flex;\n\tflex-direction: column;\n\tgap: 4px;\n\tflex: 0 1 30em;\n\tmin-width: 0;\n\tmax-width: 100%;\n}\n\n.view-descriptions {\n\tdisplay: grid;\n}\n\n.view-description {\n\tgrid-area: 1 / 1;\n\tvisibility: hidden;\n\tfont-size: var(--size-label);\n\tcolor: var(--text-secondary);\n\tmargin: 0;\n\ttext-wrap: pretty;\n}\n\n.view-description.shown {\n\tvisibility: visible;\n}\n\n/* On phones only the shown description takes room: the change happens just under the switch the reader tapped. */\n.root[data-layout=\"narrow\"] .view-description:not(.shown) {\n\tdisplay: none;\n}\n\n/* One style for every control: the year, sort and filter selects, the view and theme switches, the download links,\n   the Copy button and the disclosures' summaries. */\nselect,\n.segmented button,\n.copy-button,\n.button-link,\n.disclosure > summary,\n.close-end {\n\tfont: inherit;\n\tfont-size: 14px;\n\tline-height: 1.3;\n\tcolor: var(--text-primary);\n\tbackground: var(--control-surface);\n\tborder: 1px solid var(--control-border);\n\tborder-radius: 6px;\n\tpadding: 5px 12px;\n\tmin-height: 32px;\n\tmax-width: 100%;\n\tcursor: pointer;\n}\n\n.button-link,\n.disclosure > summary {\n\tdisplay: inline-flex;\n\talign-items: center;\n\tgap: 8px;\n\ttext-decoration: none;\n}\n\n/* Hover fills only where a pointer hovers: touch browsers keep :hover on the last control tapped. */\n@media (hover: hover) {\n\t.copy-button:hover,\n\t.button-link:hover,\n\t.disclosure > summary:hover,\n\t.close-end:hover,\n\t.segmented button:not([aria-pressed=\"true\"]):hover,\n\tselect:hover {\n\t\tbackground: var(--control-hover);\n\t}\n}\n\n.page-section .button-link {\n\tcolor: var(--text-primary);\n}\n\n/* Disclosures: a chevron that points right when closed and down when open. */\n.disclosure > summary {\n\tlist-style: none;\n}\n\n.disclosure > summary::-webkit-details-marker {\n\tdisplay: none;\n}\n\n.disclosure > summary::before,\n.chevron {\n\tcontent: \"\";\n\tflex: none;\n\tdisplay: inline-block;\n\twidth: 6px;\n\theight: 6px;\n\tborder-right: 2px solid var(--chevron);\n\tborder-bottom: 2px solid var(--chevron);\n\ttransform: rotate(-45deg);\n}\n\n.disclosure > summary::before {\n\tmargin: 0 2px 0 0;\n\ttransition: transform 0.15s ease;\n}\n\n.disclosure[open] > summary::before {\n\ttransform: rotate(45deg);\n}\n\n@media (prefers-reduced-motion: reduce) {\n\t.disclosure > summary::before {\n\t\ttransition: none;\n\t}\n}\n\n/* The chevron after a chart row's value, a timeline row's name and a table cell's text: it shows at rest that\n   selecting them opens details. */\n.chevron {\n\tmargin: 0 1px 1px 7px;\n\tvertical-align: middle;\n}\n\n.pay-row:focus-visible .chevron,\n.timeline-row:focus-visible .chevron,\n.cell-button:focus-visible .chevron,\n[aria-expanded=\"true\"] .chevron {\n\tborder-color: var(--text-primary);\n}\n\n@media (hover: hover) {\n\t.pay-row:hover .chevron,\n\t.timeline-row:hover .chevron,\n\t.cell-button:hover .chevron {\n\t\tborder-color: var(--text-primary);\n\t}\n}\n\n.chart-hint {\n\tmargin: 0 0 6px;\n\tfont-size: var(--size-label);\n\tcolor: var(--text-secondary);\n}\n\n.segmented {\n\tdisplay: inline-flex;\n}\n\n.segmented button {\n\tborder-radius: 0;\n\twhite-space: nowrap;\n}\n\n.segmented button:first-child {\n\tborder-radius: 6px 0 0 6px;\n}\n\n.segmented button:last-child {\n\tborder-radius: 0 6px 6px 0;\n}\n\n.segmented button + button {\n\tborder-left: none;\n}\n\n/* The pressed button is inverted, and also carries a bar along its bottom edge in its own text colour: a cue that\n   survives a recolouring that flattens the inversion (Dark Reader's), and that changes no width. */\n.segmented button[aria-pressed=\"true\"] {\n\tbackground: var(--text-primary);\n\tcolor: var(--surface);\n\tborder-color: var(--text-primary);\n\tbox-shadow: inset 0 -3px 0 0 currentColor;\n}\n\n/* On phones the view switch spans the width, its three buttons sharing it without wrapping. */\n.root[data-layout=\"narrow\"] .view-control,\n.root[data-layout=\"narrow\"] .view-control .segmented {\n\twidth: 100%;\n}\n\n.root[data-layout=\"narrow\"] .view-control {\n\tflex-basis: 100%;\n}\n\n/* Labels may wrap inside the buttons, so the switch fits at 320 px and at 400% zoom. */\n.root[data-layout=\"narrow\"] .view-control .segmented button {\n\tflex: 1 1 0;\n\tmin-width: 0;\n\tpadding: 5px 6px;\n\twhite-space: normal;\n}\n\n/* Highlighting schools: a disclosure with a search box and checkboxes, and a chip per highlighted school. On wide\n   layouts it sits at the controls row's right edge. */\n.highlight-control {\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\talign-items: flex-start;\n\tgap: 8px;\n\tmax-width: 100%;\n}\n\n.root[data-layout=\"wide\"] .highlight-control {\n\tmargin-left: auto;\n}\n\n.picker {\n\tmargin-top: 8px;\n\tpadding: 10px;\n\tborder: 1px solid var(--gridline);\n\tborder-radius: 8px;\n\tbackground: var(--panel-surface);\n\twidth: min(420px, 100%);\n}\n\n/* Its label starts at the left like every other label (the controls row centres its labels' items). */\n.controls .picker-label {\n\tdisplay: flex;\n\tflex-direction: column;\n\talign-items: stretch;\n\tgap: 4px;\n\tfont-size: var(--size-label);\n\tcolor: var(--text-secondary);\n}\n\n.picker-search {\n\tfont: inherit;\n\tfont-size: 14px;\n\tcolor: var(--text-primary);\n\tbackground: var(--control-surface);\n\tborder: 1px solid var(--control-border);\n\tborder-radius: 6px;\n\tpadding: 5px 8px;\n\tmin-height: 32px;\n\twidth: 100%;\n}\n\n.picker-list {\n\tmax-height: 260px;\n\toverflow-y: auto;\n\tmargin: 8px 0;\n\tpadding: 0;\n\tlist-style: none;\n\tfont-size: 14px;\n}\n\n.picker-list label {\n\tdisplay: flex;\n\talign-items: center;\n\tgap: 8px;\n\tmin-height: 28px;\n\tcursor: pointer;\n}\n\n.picker-list input {\n\twidth: 16px;\n\theight: 16px;\n\taccent-color: var(--series-contract);\n}\n\n.chips {\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\tgap: 6px;\n\tmargin: 0;\n\tpadding: 0;\n\tlist-style: none;\n}\n\n/* While the picker is open the chips follow it, below, as they do in the tab order. */\n.highlight-control:has(> details[open]) > .chips {\n\tflex-basis: 100%;\n}\n\n.chip {\n\tfont-size: var(--size-label);\n\tmin-height: 32px;\n\tpadding: 3px 10px;\n\tborder: 1px solid var(--control-border);\n\tborder-radius: 16px;\n\tbackground: var(--selected);\n\tcolor: var(--text-primary);\n\tcursor: pointer;\n}\n\n.notice {\n\tbackground: var(--notice);\n\tborder-radius: 6px;\n\tpadding: 6px 10px;\n\tfont-size: 14px;\n\tmax-width: 46em;\n\ttext-wrap: pretty;\n}\n\n.legend {\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\tgap: 6px 18px;\n\tfont-size: var(--size-label);\n\tcolor: var(--text-secondary);\n\tmargin: 0 0 8px;\n\tpadding: 0;\n\tlist-style: none;\n}\n\n.legend-item {\n\tdisplay: inline-flex;\n\talign-items: center;\n\tgap: 6px;\n}\n\n.legend-note {\n\tfont-size: var(--size-label);\n}\n\n/* On phones, one item to a line: every key takes the same box, so the labels share one left edge. */\n.root[data-layout=\"narrow\"] .legend-item > :first-child {\n\tflex: none;\n\twidth: 30px;\n}\n\n.key {\n\tflex: none;\n\toverflow: visible;\n}\n\n/* Pay chart and timeline rows: a name column and a track. On narrow layouts the name sits above the track. */\n.pay-list,\n.timeline-list {\n\tlist-style: none;\n\tmargin: 0;\n\tpadding: 0;\n}\n\n.pay-list > li,\n.timeline-list > li {\n\tmargin: 0;\n\tpadding: 0;\n}\n\n.pay-row,\n.timeline-row,\n.axis-row {\n\tdisplay: grid;\n\tgrid-template-columns: var(--name-column, 150px) minmax(0, 1fr);\n\tcolumn-gap: 10px;\n\talign-items: center;\n\twidth: 100%;\n}\n\n.pay-row,\n.timeline-row {\n\tposition: relative;\n\tbackground: none;\n\tborder: none;\n\tpadding: 0;\n\tmargin: 0;\n\ttext-align: left;\n\tcursor: pointer;\n\tborder-radius: 4px;\n}\n\n.pay-row {\n\tmin-height: 34px;\n}\n\n.root[data-layout=\"wide\"] .pay-row .name {\n\talign-self: end;\n\tline-height: 14px;\n\tpadding-bottom: 4px;\n}\n\n/* Names wrap between words rather than being cut off, also when a reader's text spacing widens them; only a word\n   wider than the whole column breaks. */\n.pay-row .name,\n.timeline-row .name {\n\tfont-size: var(--size-label);\n\tcolor: var(--text-secondary);\n\ttext-align: right;\n\toverflow-wrap: break-word;\n}\n\n.name-text {\n\tdisplay: inline;\n}\n\n.name-text .status-icon {\n\tmargin-left: 4px;\n}\n\n.track {\n\tdisplay: block;\n\tline-height: 0;\n}\n\n.track svg {\n\tdisplay: block;\n\toverflow: visible;\n\tforced-color-adjust: none;\n}\n\n/* A wide row's value label sits on a backing of the surface colour, so gridlines and the median and 30 percent lines\n   pass behind it. The backing is a background, which Dark Reader darkens exactly as it darkens the widget's own. */\n.pay-row .value {\n\tposition: absolute;\n\ttop: 0;\n\tmargin-left: -3px;\n\tpadding: 0 3px;\n\tborder-radius: 3px;\n\tbackground: var(--surface);\n\tfont-size: var(--size-label);\n\tline-height: 16px;\n\twhite-space: nowrap;\n\tfont-variant-numeric: tabular-nums;\n\tcolor: var(--text-primary);\n\tpointer-events: none;\n}\n\n.pay-row[aria-expanded=\"true\"] .value {\n\tbackground: linear-gradient(var(--selected), var(--selected)), var(--surface);\n}\n\n@media (hover: hover) {\n\t.pay-row:hover .value {\n\t\tbackground: linear-gradient(var(--selected), var(--selected)), var(--surface);\n\t}\n}\n\n.tag {\n\tcolor: var(--text-muted);\n}\n\n/* A label's parts (amount, length, tags, pay per month): each whole on one line with the separator that follows it.\n   The separator box is as wide as \" \u00b7 \", so the label measures as its text does. The last part's separator is a\n   spacer, which only phones keep (see below). */\n.segment {\n\twhite-space: nowrap;\n}\n\n.separator {\n\tdisplay: inline-block;\n\twidth: 0.8em;\n\ttext-align: center;\n\tcolor: var(--text-muted);\n}\n\n.separator.end {\n\tdisplay: none;\n}\n\n.label-clip,\n.label-parts {\n\tdisplay: contents;\n}\n\n/* The yearly chart's pay per month, after the rest of the label in muted text. Where the whole label would crowd the\n   row, it takes a line of its own under the rest, without the separator. */\n.monthly {\n\tcolor: var(--text-muted);\n\twhite-space: nowrap;\n}\n\n.value.wrapped .monthly {\n\tdisplay: block;\n}\n\n.value.wrapped .before-monthly {\n\tvisibility: hidden;\n}\n\n.pay-row:focus-visible .bar,\n.pay-row:focus-visible .soft-bar {\n\tfilter: brightness(1.12);\n}\n\n/* The timeline's rows alternate a faint band, so each row's stacked marks read as its own. */\n:where(.timeline-list > li:nth-child(even)) > .timeline-row {\n\tbackground: var(--band);\n}\n\n.pay-row[aria-expanded=\"true\"],\n.timeline-row[aria-expanded=\"true\"] {\n\tbackground: var(--selected);\n}\n\n@media (hover: hover) {\n\t.pay-row:hover .bar,\n\t.pay-row:hover .soft-bar {\n\t\tfilter: brightness(1.12);\n\t}\n\n\t.pay-row:hover,\n\t.timeline-row:hover {\n\t\tbackground: var(--selected);\n\t}\n}\n\n/* Highlighted schools keep their strength and get bold names; the rest fade: their marks (and clocks) to a third of\n   their strength, their names, values and the timeline's notes to the muted ink, which keeps 4.5:1 contrast (set\n   after the narrow layout's rules below). */\n.pay-row.faded .track,\n.timeline-row.faded .track svg > :not(.track-note),\n:is(.pay-row, .timeline-row).faded .name .status-icon {\n\topacity: 0.35;\n}\n\n.pay-row.highlighted .name-text,\n.timeline-row.highlighted .name-text,\ntr.highlighted .school-name {\n\tfont-weight: 700;\n\tcolor: var(--text-primary);\n}\n\ntr.highlighted th,\ntr.highlighted td {\n\tbackground: var(--selected);\n}\n\n.pay-row:focus-visible,\n.timeline-row:focus-visible,\n.cell-button:focus-visible,\n.sort-button:focus-visible,\nselect:focus-visible,\n.picker-search:focus-visible,\n.picker-list input:focus-visible,\n.segmented button:focus-visible,\nsummary:focus-visible,\n.skip-link:focus-visible,\n.close:focus-visible,\n.close-end:focus-visible,\n.copy-button:focus-visible,\n.button-link:focus-visible,\n.link-button:focus-visible,\n.chip:focus-visible,\n.root a:focus-visible {\n\toutline: 2px solid var(--focus);\n\toutline-offset: 2px;\n}\n\n.pay-row:focus-visible,\n.timeline-row:focus-visible {\n\toutline-offset: -2px;\n}\n\n/* On narrow rows the name starts at the button's edge, so the ring sits outside it. */\n.root[data-layout=\"narrow\"] .pay-row:focus-visible,\n.root[data-layout=\"narrow\"] .timeline-row:focus-visible {\n\toutline-offset: 2px;\n}\n\n/* On phones the name sits above the bar with the value label beside it; the label takes at most 55% of the width and\n   wraps, so the name keeps room for its longest word. */\n.root[data-layout=\"narrow\"] .pay-row,\n.root[data-layout=\"narrow\"] .timeline-row,\n.root[data-layout=\"narrow\"] .axis-row {\n\tgrid-template-columns: minmax(0, 1fr) fit-content(55%);\n\tgrid-template-areas: \"name value\" \"track track\";\n\tcolumn-gap: 8px;\n}\n\n.root[data-layout=\"narrow\"] .pay-row {\n\theight: auto;\n\talign-items: start;\n\tpadding: 4px 0 6px;\n\trow-gap: 2px;\n}\n\n.root[data-layout=\"narrow\"] .timeline-row {\n\tpadding: 4px 0;\n}\n\n.root[data-layout=\"narrow\"] .pay-row .name,\n.root[data-layout=\"narrow\"] .timeline-row .name {\n\tgrid-area: name;\n\ttext-align: left;\n\tcolor: var(--text-primary);\n}\n\n/* On phones a label's parts are right-aligned, every one followed by its separator (the last one's hidden), and the\n   parts are clipped one separator short of the right edge, so a separator that ends a line falls outside and none is\n   left dangling. */\n.root[data-layout=\"narrow\"] .pay-row .value .label-clip {\n\tdisplay: block;\n\toverflow: hidden;\n}\n\n.root[data-layout=\"narrow\"] .pay-row .value .label-parts {\n\tdisplay: block;\n\tmargin-right: -0.8em;\n}\n\n.root[data-layout=\"narrow\"] .pay-row .value .separator.end {\n\tdisplay: inline-block;\n\tvisibility: hidden;\n}\n\n/* A long label wraps in balanced lines, its chevron kept at the end of the last one. */\n.root[data-layout=\"narrow\"] .pay-row .value {\n\tgrid-area: value;\n\tposition: relative;\n\tmargin: 0;\n\tpadding: 0 15px 0 0;\n\tbackground: none;\n\ttext-align: right;\n\twhite-space: normal;\n\ttext-wrap: balance;\n}\n\n.root[data-layout=\"narrow\"] .pay-row .value .chevron {\n\tposition: absolute;\n\tright: 3px;\n\tbottom: 6px;\n\tmargin: 0;\n}\n\n.root[data-layout] .pay-row.faded :is(.name, .value),\n.root[data-layout] .timeline-row.faded .name {\n\tcolor: var(--text-muted);\n}\n\n.root[data-layout=\"narrow\"] .track {\n\tgrid-area: track;\n}\n\n.root[data-layout=\"narrow\"] .axis-row .name {\n\tdisplay: none;\n}\n\n.axis-title {\n\tfont-size: var(--size-small);\n\tcolor: var(--text-muted);\n\tmargin: 2px 0 10px;\n}\n\n.track text {\n\tfont-size: var(--size-small);\n\tfill: var(--text-muted);\n\tfont-variant-numeric: tabular-nums;\n}\n\n.track .reference-label {\n\tfill: var(--text-secondary);\n}\n\n.gridline {\n\tstroke: currentColor;\n\tstroke-opacity: var(--gridline-opacity);\n\tstroke-width: 1;\n}\n\n.baseline,\n.tick {\n\tstroke: currentColor;\n\tstroke-opacity: var(--baseline-opacity);\n\tstroke-width: 1;\n}\n\n.bar.series-contract {\n\tfill: var(--series-contract);\n}\n\n.bar.series-policy {\n\tfill: var(--series-policy);\n}\n\n.bar.summer {\n\tstroke-width: 1;\n}\n\n.bar.summer.series-contract {\n\tfill: var(--series-contract-light);\n\tstroke: var(--series-contract);\n}\n\n.bar.summer.series-policy {\n\tfill: var(--series-policy-light);\n\tstroke: var(--series-policy);\n}\n\n/* The 12-month outline: hollow, with a fine dashed edge in muted ink, the same after both kinds of bar, so it never\n   reads as pay (which is always tinted, summer pay included). */\n.extension {\n\tfill: none;\n\tstroke: var(--text-muted);\n\tstroke-width: 1;\n\tstroke-dasharray: 3 2;\n}\n\n.soft-bar {\n\tstroke-width: 1;\n}\n\n.soft-bar.series-contract,\n.hatch-line.series-contract {\n\tstroke: var(--series-contract);\n}\n\n.soft-bar.series-policy,\n.hatch-line.series-policy {\n\tstroke: var(--series-policy);\n}\n\n.hatch-ground {\n\tfill: none;\n}\n\n.hatch-line {\n\tstroke-width: 2;\n}\n\n/* University policy's hatch: light stripes over the bar's fill, edged in the series colour so the bar's edge keeps its\n   contrast. */\n.policy-hatch {\n\tstroke: var(--series-policy);\n\tstroke-width: 1;\n}\n\n.policy-stripe {\n\tstroke: #ffffff;\n\tstroke-opacity: 0.5;\n\tstroke-width: 1.5;\n}\n\n/* Living costs on the bars: a dot for rent, a vertical line for living costs from the cost of attendance, the dashed\n   30 percent line on the rent chart, and the dotted median on the pay chart. */\n.living-mark {\n\tfill: var(--living-mark);\n\tstroke: var(--surface);\n\tstroke-width: 2;\n\tpaint-order: stroke;\n}\n\n/* A partial estimate (its budget leaves some costs unitemized) is hollow. */\n.living-mark.partial {\n\tfill: none;\n\tstroke: var(--living-mark);\n\tstroke-width: 1.5;\n\tpaint-order: normal;\n}\n\n.burden-line {\n\tstroke: var(--living-mark);\n\tstroke-width: 1.5;\n\tstroke-dasharray: 4 3;\n}\n\n.median-line {\n\tstroke: var(--text-secondary);\n\tstroke-width: 1;\n\tstroke-dasharray: 1 3;\n\tstroke-linecap: round;\n}\n\n.flag {\n\tcolor: var(--burden);\n}\n\n/* The network's credit inside a chart's frame. */\n.credit {\n\tdisplay: block;\n\toverflow: visible;\n\tmargin-top: 2px;\n}\n\n.credit text {\n\tfont-size: var(--size-small);\n\tfill: var(--text-muted);\n}\n\n.notes {\n\tmargin: 4px 0 12px;\n\tfont-size: var(--size-label);\n\tcolor: var(--text-secondary);\n}\n\n.note-line {\n\tmax-width: 46em;\n\ttext-wrap: pretty;\n}\n\n.how-to-read ul {\n\tmargin: 8px 0 0;\n\tpadding-left: 18px;\n\tmax-width: 46em;\n}\n\n.how-to-read li {\n\tmargin: 4px 0;\n\ttext-wrap: pretty;\n}\n\n.soft-block {\n\tmargin: 16px 0 8px;\n\tpadding-top: 12px;\n\tborder-top: 1px solid var(--gridline);\n}\n\n.soft-block .block-heading {\n\tmargin-bottom: 4px;\n}\n\n.soft-block > p {\n\tfont-size: var(--size-label);\n\tmax-width: 46em;\n\ttext-wrap: pretty;\n}\n\n.not-charted {\n\tmargin: 12px 0 0;\n\tfont-size: 14px;\n\tcolor: var(--text-secondary);\n}\n\n.not-charted ul {\n\tmargin: 8px 0 0;\n\tpadding: 0;\n\tlist-style: none;\n}\n\n.not-charted li {\n\tmargin: 6px 0;\n}\n\n/* Timeline */\n.timeline-details > .subtitle {\n\tmargin-top: 10px;\n}\n\n.contract-bar {\n\tstroke-width: 1;\n}\n\n.contract-bar.status-current {\n\tfill: var(--series-contract);\n\tstroke: var(--series-contract);\n}\n\n.contract-bar.status-expired-continuing {\n\tfill: var(--series-contract-continuing);\n\tstroke: var(--series-contract);\n}\n\n/* \"Expired, no successor yet\" is hollow: an outline with nothing inside, which no restyling of colours can fill. */\n.contract-bar.status-expired {\n\tfill: none;\n\tstroke: var(--series-contract);\n\tstroke-width: 1.5;\n}\n\n/* Superseded and unknown contracts also have a dashed edge, so they differ from \"terms still apply\" without colour. */\n.contract-bar.status-superseded,\n.contract-bar.status-unknown {\n\tfill: var(--series-superseded);\n\tstroke: var(--text-secondary);\n\tstroke-dasharray: 3 2;\n}\n\n.marker {\n\tfill: var(--text-primary);\n\tstroke: var(--surface);\n\tstroke-width: 2;\n\tpaint-order: stroke;\n}\n\n.marker-other {\n\tfill: var(--text-secondary);\n\tstroke-width: 1;\n}\n\n/* A mark whose place is approximate (a date known only to the year, or an event off the scale): hollow. */\n.marker.hollow {\n\tfill: var(--surface);\n\tstroke: var(--text-primary);\n\tstroke-width: 1.5;\n\tpaint-order: normal;\n}\n\n.as-of {\n\tstroke: var(--text-muted);\n\tstroke-width: 1;\n}\n\n.track .track-note {\n\tfont-size: var(--size-small);\n\tfill: var(--text-muted);\n}\n\n/* Table */\n.table-details > summary {\n\tmargin-bottom: 8px;\n}\n\n.table-explainer {\n\tfont-size: var(--size-label);\n\tcolor: var(--text-secondary);\n\tmax-width: 52em;\n}\n\n.table-controls {\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\tgap: 8px 20px;\n\tmargin: 8px 0;\n}\n\n/* The table is drawn as cards (cards on the disclosure) on phones and wherever its columns do not fit; then \"Sort by\"\n   does the headings' job. */\n.table-details:not(.cards) .sort-control,\n.table-details:not(.cards) .narrow-only,\n.table-details.cards .wide-only {\n\tdisplay: none;\n}\n\n/* On cards both controls put their label above the select. */\n.table-details.cards .table-controls label {\n\tflex-direction: column;\n\talign-items: flex-start;\n}\n\n.table-wrap {\n\toverflow-x: auto;\n}\n\n/* Where the table fits without scrolling sideways, its heading row stays in view as the page scrolls, with a rule\n   along its bottom edge (a box shadow does not paint on collapsed-border cells). */\n.table-details:not(.cards) .table-wrap.fits {\n\toverflow: visible;\n}\n\n.table-details:not(.cards) .table-wrap.fits thead th {\n\tposition: sticky;\n\ttop: var(--sticky-top, 0px);\n\tz-index: 2;\n\tbackground: var(--surface);\n}\n\n.table-details:not(.cards) .table-wrap.fits thead th::after {\n\tcontent: \"\";\n\tposition: absolute;\n\tleft: 0;\n\tright: 0;\n\tbottom: -1px;\n\theight: 1px;\n\tbackground: var(--baseline);\n}\n\ntable {\n\tborder-collapse: collapse;\n\twidth: 100%;\n\tfont-size: 14px;\n}\n\ncaption {\n\ttext-align: left;\n\tpadding-bottom: 8px;\n\tfont-weight: 600;\n\tcolor: var(--text-primary);\n}\n\nth,\ntd {\n\ttext-align: left;\n\tpadding: 8px;\n\tborder-bottom: 1px solid var(--gridline);\n\tvertical-align: top;\n}\n\nth {\n\tcolor: var(--text-secondary);\n\tfont-weight: 600;\n}\n\ntbody th .school-name {\n\tcolor: var(--text-primary);\n}\n\n/* The school's name in the page's other language, with its state, beneath the name. */\n.other-name {\n\tdisplay: block;\n\tfont-size: var(--size-small);\n\tfont-weight: 400;\n}\n\n.status-line {\n\tdisplay: block;\n\tmargin-top: 2px;\n}\n\n.status-marker {\n\tdisplay: inline-flex;\n\talign-items: center;\n\tgap: 4px;\n\tfont-size: var(--size-small);\n\tfont-weight: 400;\n\tcolor: var(--text-secondary);\n}\n\ntd.number {\n\ttext-align: right;\n\tfont-variant-numeric: tabular-nums;\n}\n\n/* Headings over figures align with them, at the right. */\nth.number,\ntd.number .cell-button,\nth.number .sort-button {\n\ttext-align: right;\n}\n\n/* A school's name and a contract's status break only between words (in Chinese, at a comma: \u5df2\u5230\u671f\uff0c/\u6761\u6b3e\u7ee7\u7eed\u9002\u7528),\n   so narrow columns don't split them between any two characters; in Chinese the same holds for the benefit labels,\n   the notes where a figure is missing and the headings. */\ntbody th .school-name,\ntd.contract .main,\n.root:lang(zh) :is(td .main, td .muted, th .sort-button, tr.divider td) {\n\tword-break: keep-all;\n}\n\n/* Amounts and shares stay whole; the parts of a label may wrap between them. */\n.nowrap {\n\twhite-space: nowrap;\n}\n\n.share-bar {\n\tdisplay: block;\n\tmargin: 3px 0 0 auto;\n\tforced-color-adjust: none;\n}\n\n.share-track {\n\tfill: var(--gridline);\n}\n\n.share-fill {\n\tfill: var(--text-secondary);\n}\n\n.share-tick {\n\tstroke: var(--text-primary);\n\tstroke-width: 1.5;\n}\n\ntr.divider td {\n\tcolor: var(--text-muted);\n\tfont-size: var(--size-label);\n\tborder-bottom: 2px solid var(--baseline);\n\tpadding-top: 16px;\n}\n\n.sort-button {\n\tmin-height: 24px;\n\tbackground: none;\n\tborder: none;\n\tpadding: 0;\n\tcursor: pointer;\n\ttext-align: left;\n\tfont-weight: 600;\n}\n\n@media (hover: hover) {\n\t.sort-button:hover {\n\t\ttext-decoration: underline;\n\t\ttext-underline-offset: 3px;\n\t}\n}\n\n/* The sort mark is joined to the heading's last word by a no-break space, so it never takes a line alone. */\nth[aria-sort=\"none\"] .sort-button::after {\n\tcontent: \"\\00a0\u2195\" / \"\";\n\tcolor: var(--text-muted);\n\tfont-weight: 400;\n}\n\nth[aria-sort=\"ascending\"] .sort-button::after {\n\tcontent: \"\\00a0\u25b2\" / \"\";\n}\n\nth[aria-sort=\"descending\"] .sort-button::after {\n\tcontent: \"\\00a0\u25bc\" / \"\";\n}\n\n/* Column headings sort on the table; on cards, where the heading row is hidden, they are plain text, so no Tab stop\n   lands on an invisible button. */\n.table-details:not(.cards) .header-text,\n.table-details.cards .sort-button {\n\tdisplay: none;\n}\n\n.cell-button {\n\tmin-height: 24px;\n\tbackground: none;\n\tborder: none;\n\tpadding: 0;\n\ttext-align: left;\n\tcursor: pointer;\n\tborder-radius: 2px;\n}\n\n.cell-button:focus-visible .main,\n.cell-button[aria-expanded=\"true\"] .main {\n\ttext-decoration: underline;\n\ttext-underline-offset: 3px;\n}\n\n@media (hover: hover) {\n\t.cell-button:hover .main {\n\t\ttext-decoration: underline;\n\t\ttext-underline-offset: 3px;\n\t}\n}\n\n/* The conditions a benefit depends on, in up to three lines; the preview and the details give them in full. */\n.cell-button .scope {\n\tdisplay: -webkit-box;\n\t-webkit-line-clamp: 3;\n\t-webkit-box-orient: vertical;\n\toverflow: hidden;\n\tcolor: var(--text-muted);\n\tfont-size: var(--size-small);\n\tmax-width: 22em;\n}\n\n/* Cards: on phones, and wherever the table's columns do not fit its box (a tablet in portrait). The column headings\n   stay in the accessibility tree, hidden visually. A card is the school's name, then one line per column, its label\n   beside its value: one column of lines on phones, two where there is room. */\n.table-details.cards .table-wrap > table,\n.table-details.cards .table-wrap > table > tbody,\n.table-details.cards .table-wrap > table > tbody > tr,\n.table-details.cards .table-wrap > table > tbody > tr > th,\n.table-details.cards .table-wrap > table > caption {\n\tdisplay: block;\n\twidth: 100%;\n}\n\n.table-details.cards thead {\n\tposition: absolute;\n\twidth: 1px;\n\theight: 1px;\n\toverflow: hidden;\n\tclip: rect(0 0 0 0);\n\tclip-path: inset(50%);\n}\n\n.table-details.cards .table-wrap > table > tbody > tr {\n\tdisplay: grid;\n\tgrid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));\n\tcolumn-gap: 24px;\n\tborder-bottom: 1px solid var(--gridline);\n\tpadding: 10px 0;\n}\n\n.table-details.cards tbody th {\n\tgrid-column: 1 / -1;\n\tmargin-bottom: 2px;\n}\n\n.table-details.cards .table-wrap > table > tbody > tr > td {\n\tdisplay: grid;\n\tgrid-template-columns: minmax(0, 38%) minmax(0, 1fr);\n\tcolumn-gap: 10px;\n\talign-items: center;\n\tmin-height: 44px;\n\ttext-align: left;\n}\n\n.table-details.cards th,\n.table-details.cards td {\n\tborder: none;\n\tpadding: 0;\n}\n\n.table-details.cards td::before {\n\tcontent: attr(data-label) / \"\";\n\tcolor: var(--text-muted);\n\tfont-size: var(--size-small);\n\tline-height: 1.3;\n}\n\n.root:lang(zh) .table-details.cards td::before {\n\tword-break: keep-all;\n}\n\n/* A details panel that opens inside a card's line takes the whole line. */\n.table-details.cards td > .panel {\n\tgrid-column: 1 / -1;\n}\n\n.table-details.cards .cell-button {\n\twidth: 100%;\n\tmin-height: 44px;\n}\n\n.table-details.cards td.number .cell-button {\n\ttext-align: left;\n}\n\n.table-details.cards .share-bar {\n\tmargin-left: 0;\n}\n\n.table-details.cards .table-wrap > table > tbody > tr.divider {\n\tdisplay: block;\n}\n\n.table-details.cards .table-wrap > table > tbody > tr.divider > td {\n\tdisplay: block;\n\tmin-height: 0;\n}\n\n.table-details.cards tr.divider td::before {\n\tcontent: none;\n}\n\n/* Hover previews and details panels. A preview touches its row and can be hovered, so the pointer can move into it. */\n.preview {\n\tposition: absolute;\n\tz-index: 30;\n\twidth: max-content;\n\tmax-width: min(300px, calc(100% - 16px));\n\tbackground: var(--panel-surface);\n\tborder: 1px solid var(--border);\n\tborder-radius: 8px;\n\tbox-shadow: var(--panel-shadow);\n\tpadding: 8px 10px;\n\tfont-size: var(--size-label);\n\tline-height: 1.4;\n\tcursor: pointer;\n}\n\n.preview p {\n\tmargin: 0 0 3px;\n}\n\n.preview .preview-title {\n\tcolor: var(--text-secondary);\n}\n\n.preview .preview-value {\n\tfont-weight: 600;\n\tfont-variant-numeric: tabular-nums;\n}\n\n.preview .hint {\n\tcolor: var(--text-muted);\n\tfont-size: var(--size-small);\n\tmargin: 4px 0 0;\n}\n\n.clamp {\n\tdisplay: -webkit-box;\n\t-webkit-line-clamp: 3;\n\t-webkit-box-orient: vertical;\n\toverflow: hidden;\n}\n\n.panel {\n\tbackground: var(--panel-surface);\n\tcolor: var(--text-primary);\n\tborder: 1px solid var(--border);\n\tborder-radius: 10px;\n\tpadding: 10px 14px 12px;\n\tmargin: 6px 0 10px;\n\tfont-size: var(--size-label);\n\tfont-weight: 400;\n\tline-height: 1.45; 			}
			function updateHeader() {
				for (const { column, button, label, cell } of headerCells) {
					button.textContent = column.label();
					label.textContent = column.label();
					cell.setAttribute("aria-sort", state.sort.key === column.key ? state.sort.direction : "none");
				}
				sortSelect.replaceChildren(...sortOptions.map((value) => element("option", { value, text: orderName(...value.split(":")) })));
				sortSelect.value = `${state.sort.key}:${state.sort.direction}`;
				caption.textContent = text.caption(state.year);
				const toCheck = data.institutions.filter((institution) => statusOf(institution).state === "check").length;
				const options = [
					["all", text.filterAll(data.institutions.length)],
					state.highlighted.size ? ["highlighted", text.filterHighlighted(state.highlighted.size)] : null,
					toCheck ? ["check", text.filterCheck(toCheck)] : null,
				].filter(Boolean);
				if (!options.some(([value]) => value === state.tableFilter)) state.tableFilter = "all";
				filterSelect.replaceChildren(...options.map(([value, label]) => element("option", { value, selected: value === state.tableFilter, text: label })));
				filterSelect.value = state.tableFilter;
			}
			function announceSort() {
				announce(text.sorted(orderName(state.sort.key, state.sort.direction)));
			}
			function cellButton(main, extras, column, value, handlers, institution) {
				const name = (cards ? text.cardCellName(institution.name, column, value) : value).replaceAll("\u200b", "");
				const button = element("button", { type: "button", class: "cell-button", "aria-label": strings.showDetails(name) }, [element("span", { class: "main" }, withTrailing(main, chevron())), ...extras]);
				popups.attach(button, handlers);
				return button;
			}
			function muted(content) {
				return element("span", { class: "muted" }, keepYearsWhole(content));
			}
			function livingHandlers(institution) {
				return { preview: () => livingPreview(institution, state.year), details: () => livingDetails(institution, state.year) };
			}
			function shareBar(value) {
				const width = 48;
				const scale = (share) => Math.min(share / RENT_SHARE_BAR_MAXIMUM, 1) * width;
				const svg = svgElement("svg", { class: "share-bar", width, height: 10, viewBox: `0 0 ${width} 10`, "aria-hidden": "true", focusable: "false" });
				svg.append(
					svgElement("rect", { class: "share-track", x: 0, y: 3, width, height: 4, rx: 2 }),
					svgElement("rect", { class: "share-fill", x: 0, y: 3, width: Math.max(scale(value), 2), height: 4, rx: 2 }),
					svgElement("line", { class: "share-tick", x1: scale(RENT_BURDEN_SHARE), x2: scale(RENT_BURDEN_SHARE), y1: 0, y2: 10 }),
				);
				return svg;
			}
			function rentCell(institution, label) {
				const summary = livingSummary(institution, state.year);
				if (!summary || summary.rent === null) return { cell: element("td", { class: "number", "data-label": label }, muted(text.noRent)), button: null };
				const rentShare = institution.excluded ? null : summary.rentShare;
				let button;
				if (rentShare !== null) {
					const value = share(rentShare);
					button = cellButton(
						[element("span", { class: "nowrap", text: value })],
						[shareBar(rentShare)],
						label,
						[value, rentShare > RENT_BURDEN_SHARE ? text.aboveLine : text.belowLine].join(strings.listSeparator),
						livingHandlers(institution),
						institution,
					);
				} else {
					const gap = payGapText(institution, state.year, "year", false) || text.noRent;
					button = cellButton([muted(gap)], [], label, gap, livingHandlers(institution), institution);
				}
				return { cell: element("td", { class: "number", "data-label": label }, button), button };
			}
			function estimateCell(institution, label) {
				const summary = livingSummary(institution, state.year);
				const budgets = summary ? summary.costs.budgets : [];
				const combined = summary ? summary.costs.combined_budgets : [];
				if (!budgets.length && combined.length) {
					const gap = strings.living.combinedShort;
					const button = cellButton([muted(gap)], [], label, gap, livingHandlers(institution), institution);
					return { cell: element("td", { class: "number", "data-label": label }, button), button };
				}
				if (!budgets.length) return { cell: element("td", { class: "number", "data-label": label }, muted(text.noEstimate)), button: null };
				const payShare = institution.excluded ? null : summary.payShare;
				let button;
				if (payShare !== null) {
					const basis = budgets[0].pay_share_basis;
					const scopes = [basis ? strings.living.perTermTag(strings.units[basis.per] || basis.per) : null, summary.partial ? strings.living.partialTag : null].filter(Boolean);
					const value = share(payShare);
					button = cellButton(
						[element("span", { class: "nowrap", text: value })],
						[scopes.length ? element("span", { class: "scope", text: scopes.join(strings.separator) }) : null],
						label,
						[value, ...scopes].join(strings.listSeparator),
						livingHandlers(institution),
						institution,
					);
				} else {
					const gap = summary.estimate !== null ? payGapText(institution, state.year, "month", false) || text.periodNotStated : text.periodNotStated;
					button = cellButton([muted(gap)], [], label, gap, livingHandlers(institution), institution);
				}
				return { cell: element("td", { class: "number", "data-label": label }, button), button };
			}
			function nameCell(institution) {
				const status = statusOf(institution);
				const label = status.state === "check" ? strings.status.check : strings.status.current;
				const marker = element(
					"button",
					{ type: "button", class: `cell-button status-marker ${status.state}`, "aria-label": strings.showDetails(cards ? text.cardCellName(institution.name, text.statusColumn, label) : label) },
					[statusIcon(status.state), element("span", { class: "main", text: status.state === "check" ? strings.status.markerCheck : strings.status.markerCurrent }), chevron()],
				);
				popups.attach(marker, {
					preview: () => [
						element("p", { class: "preview-title" }, nameNode(institution)),
						element("p", { class: "preview-value" }, [statusIcon(status.state), ` ${label}`]),
						...status.reasons.map((reason) => element("p", {}, keepYearsWhole(reasonText(reason)))),
					],
					details: () => statusDetails(institution),
				});
				const stateText = institution.state ? `${strings.separator}${institution.state}`.replace(/ /g, "\u00a0") : null;
				return {
					cell: element("th", { scope: "row" }, [
						element("span", { class: "school-name" }, nameNode(institution)),
						institution.other_name
							? element("span", { class: "other-name muted" }, [inLanguage(institution.other_name, institution.other_name_language), stateText])
							: institution.state
								? element("span", { class: "muted", text: ` ${institution.state}` })
								: null,
						element("span", { class: "status-line" }, marker),
					]),
					button: marker,
				};
			}
			function notRankedButton(institution, label) {
				return cellButton([muted(text.notRanked)], [], label, text.notRanked, {
					preview: () => [element("p", { class: "preview-title" }, nameNode(institution)), element("p", { class: "preview-value", text: text.notRanked }), institution.reason ? element("p", { class: "clamp" }, reasonNode(institution)) : null],
					details: () => ({ title: fillSlots(text.notRankedTitle(slot(0)), [headingName(institution)]), body: [institution.reason ? element("p", {}, reasonNode(institution)) : element("p", { text: strings.notCharted.leftOut })] }),
				}, institution);
			}
			function renderRow(institution) {
				const year = state.year;
				const shown = shownPay(institution);
				const value = shown ? valueFor(shown.figure, state.mode) : null;
				const payLabel = columns[1].label();
				let payCell;
				let payButton = null;
				if (value !== null) {
					const { figure } = shown;
					const label = figureLabel(figure, state.mode, false);
					if (figure.summer) label.tags.unshift(strings.tags.withSummer);
					const lagging = shown.year !== year;
					const tags = [lagging ? strings.status.showingYear(shown.year) : null, ...label.tags].filter(Boolean);
					payButton = cellButton(
						label.main.map((part, index) => element("span", { class: "nowrap", text: index ? `${strings.separator}${part}` : part })),
						[tags.length ? element("span", { class: "scope" }, keepYearsWhole(tags.join(strings.separator))) : null],
						payLabel,
						[labelText(label), lagging ? strings.status.noRate(year, shown.year) : null].filter(Boolean).join(strings.listSeparator),
						{
							preview: () => payPreview(institution, figure, state.mode, null, shown.year),
							details: () => payDetails(institution, figure, state.mode, shown.year),
						},
						institution,
					);
					payCell = element("td", { class: "number", "data-label": payLabel }, payButton);
				} else if (institution.excluded) {
					payButton = notRankedButton(institution, payLabel);
					payCell = element("td", { class: "number", "data-label": payLabel }, payButton);
				} else {
					let content = missingFigureText(institution, year, false);
					if (institution.pay[year]) content = text.noFigureForUnit(strings.modeAdjective[state.mode]);
					payCell = element("td", { class: "number", "data-label": payLabel }, muted(content));
				}
				const name = nameCell(institution);
				const rent = rentCell(institution, text.rentShare);
				const estimate = estimateCell(institution, text.payShare);
				const representation = institution.representation;
				const contractButton = cellButton([representation.label], [], text.unionContract, representation.label, {
					preview: () => representationPreview(institution),
					details: () => representationDetails(institution),
				}, institution);
				const termButtons = TERM_KEYS.map((key) => {
					const view = termView(institution, key, year);
					if (!view) return null;
					return cellButton(
						[termLabelNode(view)],
						[view.scope ? element("span", { class: "scope", lang: langOf("en"), text: view.scope }) : null],
						strings.terms[key].label,
						[termLabel(view), view.scope ? strings.terms.scopeName(view.scope) : null].filter(Boolean).join(strings.listSeparator),
						{
							preview: () => termPreview(institution, key, view),
							details: () => termDetails(institution, key, view),
						},
						institution,
					);
				});
				const row = element("tr", { "data-key": institution.id, class: emphasisClass(institution).trim() || null }, [
					name.cell,
					payCell,
					rent.cell,
					estimate.cell,
					element("td", { class: "contract", "data-label": text.unionContract }, contractButton),
					...TERM_KEYS.map((key, index) => element("td", { "data-label": strings.terms[key].label }, termButtons[index] || muted(text.notResearched))),
				]);
				return { row, buttons: [name.button, payButton, rent.button, estimate.button, contractButton, ...termButtons] };
			}
			function drawRows() {
				const column = columns.find((candidate) => candidate.key === state.sort.key);
				const shownSchools = data.institutions.filter((institution) => {
					if (state.tableFilter === "highlighted") return state.highlighted.has(institution.id);
					if (state.tableFilter === "check") return statusOf(institution).state === "check";
					return true;
				});
				const ranked = [];
				const soft = [];
				const unknown = [];
				for (const institution of shownSchools) {
					const value = column.sortValue(institution);
					if (value === null || value === undefined) unknown.push(institution);
					else if (column.key === "pay" && institution.pay[state.year]?.soft) soft.push(institution);
					else ranked.push(institution);
				}
				const order = (first, second) => {
					const firstValue = column.sortValue(first);
					const secondValue = column.sortValue(second);
					const difference = typeof firstValue === "number" ? firstValue - secondValue : collator.compare(String(firstValue), String(secondValue));
					return (state.sort.direction === "ascending" ? difference : -difference) || byName(first, second);
				};
				ranked.sort(order);
				soft.sort(order);
				unknown.sort(byName);
				const groups = [
					{ rows: ranked, divider: null },
					{ rows: soft, divider: text.softDivider },
					{ rows: unknown, divider: column.key === "pay" ? text.divider(strings.modeAdjective[state.mode], state.year) : null },
				];
				const rendered = [];
				const rows = [];
				for (const group of groups) {
					if (!group.rows.length) continue;
					if (group.divider && rows.length) rows.push(element("tr", { class: "divider" }, element("td", { colspan: columns.length }, keepYearsWhole(group.divider))));
					for (const institution of group.rows) {
						const entry = { institution, ...renderRow(institution) };
						rendered.push(entry);
						rows.push(entry.row);
					}
				}
				body.replaceChildren(...rows);
				tableGrid(rendered);
			}
			function renderBody() {
				popups.closeAll();
				const narrow = isNarrow();
				cards = narrow;
				details.classList.toggle("cards", cards);
				wrap.classList.remove("fits");
				drawRows();
				if (narrow || !details.open || !wrap.clientWidth) return;
				wideWidth = tableElement.scrollWidth;
				if (wideWidth <= wrap.clientWidth + 1) wrap.classList.add("fits");
				else {
					cards = true;
					details.classList.add("cards");
					drawRows();
				}
			}
			function tableGrid(rendered) {
				const grid = rendered.map((entry) => entry.buttons);
				const all = grid.flat().filter(Boolean);
				if (!all.length) return;
				const keyOf = (rowIndex, columnIndex) => `${rendered[rowIndex].institution.id}:${columnIndex}`;
				let active = null;
				grid.forEach((buttons, rowIndex) =>
					buttons.forEach((button, columnIndex) => {
						if (!button) return;
						button.tabIndex = -1;
						button.dataset.cell = keyOf(rowIndex, columnIndex);
						if (keyOf(rowIndex, columnIndex) === state.activeCell) active = button;
						button.addEventListener("focus", () => {
							for (const other of all) other.tabIndex = -1;
							button.tabIndex = 0;
							state.activeCell = keyOf(rowIndex, columnIndex);
						});
						button.addEventListener("keydown", (event) => {
							let target = null;
							const rowButtons = grid[rowIndex];
							const find = (start, step, pick) => {
								for (let index = start; index >= 0 && index < (pick === "row" ? rowButtons.length : grid.length); index += step) {
									const candidate = pick === "row" ? rowButtons[index] : grid[index][columnIndex];
									if (candidate) return candidate;
								}
								return null;
							};
							if (event.key === "ArrowRight") target = find(columnIndex + 1, 1, "row");
							else if (event.key === "ArrowLeft") target = find(columnIndex - 1, -1, "row");
							else if (event.key === "ArrowDown") target = find(rowIndex + 1, 1, "column");
							else if (event.key === "ArrowUp") target = find(rowIndex - 1, -1, "column");
							else if (event.key === "Home") target = event.ctrlKey ? all[0] : find(0, 1, "row");
							else if (event.key === "End") target = event.ctrlKey ? all.at(-1) : find(rowButtons.length - 1, -1, "row");
							else return;
							event.preventDefault();
							if (target) target.focus();
						});
					}),
				);
				(active || all[0]).tabIndex = 0;
			}
			return {
				section: details,
				details,
				update() {
					updateHeader();
					renderBody();
				},
				relayout() {
					if (!details.open || isNarrow()) return;
					if (cards ? wideWidth <= wrap.clientWidth + 1 : tableElement.scrollWidth > wrap.clientWidth + 1) renderBody();
				},
				focusCell(key) {
					const button = body.querySelector(`[data-cell="${CSS.escape(key)}"]`);
					if (button) button.focus({ preventScroll: true });
				},
			};
		}
		render();
		renderTimeline();
		placeContents();
		updateCurrentSection();
		if (state.section) requestAnimationFrame(() => sectionHeadings[state.section] && goToSection(state.section, false));
	}
	function startAll() {
		for (const mount of document.querySelectorAll(".aun-contract-comparison")) start(mount);
	}
	if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", startAll);
	else startAll();
})();
})();
</script>
</body>
</html>
